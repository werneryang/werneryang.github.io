<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#d9b67a">
<title>守城小英雄</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#caa56a;overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#2b1d10}
  canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 8px 0;display:flex;gap:6px;align-items:center;justify-content:space-between;pointer-events:none}
  .pill{background:rgba(43,29,16,.78);color:#fff;border-radius:999px;padding:6px 11px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:5px;white-space:nowrap}
  #coins.bump{animation:bump .25s ease}
  @keyframes bump{50%{transform:scale(1.15)}}
  #hpPill .bar{width:52px;height:12px;border-radius:6px;background:#5b3b2a;overflow:hidden}
  #hpPill .bar i{display:block;height:100%;background:#63d36b;transition:width .2s}
  .icon-btn{flex:none;pointer-events:auto;border:0;background:rgba(43,29,16,.78);color:#fff;font-size:18px;width:40px;height:40px;border-radius:50%;cursor:pointer}
  #banner{position:fixed;left:50%;top:42%;transform:translateX(-50%);font-size:34px;font-weight:900;color:#fff;
    text-shadow:0 3px 0 #7a2a1a,0 0 12px rgba(0,0,0,.4);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s}
  #banner.show{opacity:1}
  #waveBtn{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;
    border:0;border-radius:999px;padding:12px 22px;font-size:20px;font-weight:800;color:#fff;background:#c0392b;box-shadow:0 5px 0 #7d2319;cursor:pointer;white-space:nowrap}
  #waveBtn:active{transform:translateX(-50%) translateY(3px);box-shadow:0 2px 0 #7d2319}
  .ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;
    background:rgba(40,26,12,.72);backdrop-filter:blur(3px);color:#fff}
  .ov.show{display:flex}
  .ov h1{margin:0;font-size:44px;font-weight:900;text-shadow:0 4px 0 #7a2a1a}
  .ov h2{margin:0;font-size:34px;font-weight:900}
  .ov p{margin:0;font-size:19px;line-height:1.6;max-width:420px;color:#f3e6cf}
  .ov .rec{font-size:17px;color:#ffd978}
  .ov button{border:0;border-radius:18px;font-size:24px;font-weight:900;padding:16px 26px;min-width:280px;cursor:pointer;color:#2b1d10;background:#ffd24a;box-shadow:0 6px 0 #b8871a}
  .ov button.alt{background:#fff;box-shadow:0 6px 0 #bba98c}
  .ov button small{display:block;font-size:15px;font-weight:700;opacity:.75;margin-top:2px}
  .ov button:active{transform:translateY(4px);box-shadow:0 2px 0 #b8871a}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="pill" id="coins">🪙 <span id="coinN">0</span></div>
  <div class="pill" id="waveP">波 <span id="waveN">0</span>/20</div>
  <div class="pill" id="hpPill">🏰 <div class="bar"><i id="hpBar"></i></div></div>
  <button class="icon-btn" id="pauseBtn" aria-label="暂停">⏸</button>
</div>
<div id="banner"></div>
<button id="waveBtn"></button>

<div class="ov show" id="menu">
  <h1>守城小英雄</h1>
  <p>手指按住屏幕拖动，小英雄就会走。<br>捡金币，站到虚线框里建弩塔，守住城堡！</p>
  <button id="easyBtn">轻松模式<small>敌人慢、金币多，城堡不会被打破</small></button>
  <button class="alt" id="hardBtn">挑战模式<small>守住 20 波，城堡被打破就输</small></button>
  <div class="rec" id="rec"></div>
</div>
<div class="ov" id="pauseOv">
  <h2>暂停中</h2>
  <button id="resumeBtn">继续玩</button>
  <button class="alt" id="soundBtn"></button>
  <button class="alt" id="quitBtn">回到开始画面</button>
</div>
<div class="ov" id="endOv">
  <h2 id="endTitle"></h2>
  <p id="endText"></p>
  <button id="againBtn">再玩一次</button>
  <button class="alt" id="menuBtn">回到开始画面</button>
</div>

<script>
(() => {
// ================= 基础 =================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const WW = 600, WH = 960;                       // 世界大小（竖屏）
let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const topPad = 56, botPad = 70;
  scale = Math.min(innerWidth / WW, (innerHeight - topPad - botPad) / WH);
  offX = (innerWidth - WW * scale) / 2; offY = topPad + (innerHeight - topPad - botPad - WH * scale) / 2;
}
addEventListener('resize', resize); resize();
const rand = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
let soundOn = true;
try { soundOn = localStorage.getItem('ch_sound') !== '0'; } catch (e) {}

// ================= 声音 =================
let ac = null, lastCoinSnd = 0;
function tone(f, len, vol = 0.06, type = 'sine', st = 0) {
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + st, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + len + 0.05);
  } catch (e) {}
}
const sCoin = () => { const n = performance.now(); if (n - lastCoinSnd > 70) { lastCoinSnd = n; tone(1320 + rand(-60, 60), 0.08, 0.03, 'triangle'); } };
const sBuild = () => { tone(523, .15, .08); tone(659, .15, .08, 'sine', .1); tone(784, .3, .08, 'sine', .2); };
const sHit = () => tone(140, .25, .1, 'square');
const sWave = () => { tone(392, .25, .07, 'sawtooth'); tone(523, .4, .07, 'sawtooth', .22); };

// ================= 地图 =================
const PATH = [[300,-40],[300,110],[130,190],[110,340],[460,420],[480,590],[150,650],[150,790],[300,840],[300,880]];
const SEG = []; let PATH_LEN = 0;
for (let i = 0; i < PATH.length - 1; i++) {
  const [x1, y1] = PATH[i], [x2, y2] = PATH[i + 1], l = Math.hypot(x2 - x1, y2 - y1);
  SEG.push({ x1, y1, x2, y2, l, s: PATH_LEN }); PATH_LEN += l;
}
function posAt(s) {
  s = Math.max(0, Math.min(PATH_LEN, s));
  for (const g of SEG) if (s <= g.s + g.l) { const t = (s - g.s) / g.l; return { x: g.x1 + (g.x2 - g.x1) * t, y: g.y1 + (g.y2 - g.y1) * t }; }
  const g = SEG[SEG.length - 1]; return { x: g.x2, y: g.y2 };
}
function distToPath(x, y) {
  let m = 1e9;
  for (const g of SEG) {
    const dx = g.x2 - g.x1, dy = g.y2 - g.y1, t = Math.max(0, Math.min(1, ((x - g.x1) * dx + (y - g.y1) * dy) / (g.l * g.l)));
    m = Math.min(m, Math.hypot(x - g.x1 - dx * t, y - g.y1 - dy * t));
  }
  return m;
}
const CASTLE = { x: 300, y: 905 };
// 建造点：type、首次造价
const PAD_DEFS = [
  { x: 215, y: 270, type: 'arrow', cost: 20 },
  { x: 300, y: 525, type: 'arrow', cost: 30 },
  { x: 395, y: 290, type: 'arrow', cost: 40 },
  { x: 245, y: 745, type: 'arrow', cost: 50 },
  { x: 420, y: 740, type: 'arrow', cost: 60 },
  { x: 55,  y: 500, type: 'arrow', cost: 70 },
  { x: 545, y: 250, type: 'cannon', cost: 100 },
  { x: 60,  y: 800, type: 'cannon', cost: 120 },
];
const TOWER = {
  arrow:  { range: [0, 150, 170, 195], dmg: [0, 10, 18, 30], rate: [0, 1.1, 1.5, 2.0], name: '弩塔' },
  cannon: { range: [0, 140, 150, 165], dmg: [0, 22, 40, 65], rate: [0, .55, .7, .85], splash: 58, name: '炮塔' },
};
// 装饰（固定随机）
const DECOR = (() => {
  let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const out = [];
  for (let i = 0; i < 70 && out.length < 34; i++) {
    const x = r() * WW, y = r() * (WH - 140) + 10;
    if (distToPath(x, y) < 55) continue;
    if (PAD_DEFS.some(p => Math.hypot(p.x - x, p.y - y) < 55)) continue;
    if (out.some(o => Math.hypot(o.x - x, o.y - y) < 40)) continue;
    out.push({ x, y, k: r() < .65 ? 'tree' : 'rock', r: 12 + r() * 10 });
  }
  return out;
})();

// ================= 游戏状态 =================
let G = null, running = false, paused = false;
const input = { active: false, sx: 0, sy: 0, x: 0, y: 0, keys: {} };

function newGame(mode) {
  const easy = mode === 'easy';
  G = {
    mode, easy,
    coins: 20, castleHp: 20, castleMax: 20, castleFlash: 0,
    hero: { x: 300, y: 790, vx: 0, vy: 0, face: 1, atkCd: 0, swing: 0, bob: 0 },
    pads: PAD_DEFS.map(p => ({ ...p, level: 0, paid: 0, need: p.cost, payT: 0, cd: 0, angle: -Math.PI / 2, flash: 0 })),
    enemies: [], coinsOnGround: [], shots: [], parts: [], floaters: [], flyCoins: [],
    wave: 0, waveActive: false, toSpawn: [], spawnT: 0, countdown: 15, time: 0, tipShown: true, built: 0,
  };
  running = true; paused = false;
  ['menu', 'endOv', 'pauseOv'].forEach(id => $(id).classList.remove('show'));
  $('hpPill').style.display = easy ? 'none' : '';
  hud(); showBanner('捡金币、建塔、守城堡！', 2200);
}

function startWave() {
  if (!G || G.waveActive) return;
  if (G.countdown > 1 && G.wave > 0) { const b = Math.floor(G.countdown); if (b > 0) { G.coins += b; floatText(G.hero.x, G.hero.y - 30, '+' + b + ' 提前奖励', '#ffd24a'); } }
  G.wave++; G.waveActive = true; G.countdown = 0;
  const n = G.wave, cnt = 6 + n * 2;
  const hp = 18 * Math.pow(1.15, n - 1), spd = (45 + n * 1.5) * (G.easy ? .65 : 1);
  G.toSpawn = [];
  for (let i = 0; i < cnt; i++) G.toSpawn.push({ hp, spd: spd * rand(.92, 1.08), r: 13, boss: false, drop: G.easy ? 3 : 2 });
  if (n % 5 === 0) G.toSpawn.push({ hp: hp * 8, spd: spd * .7, r: 23, boss: true, drop: 15 });
  G.spawnGap = Math.max(.35, 1.1 - n * .03); G.spawnT = 0;
  showBanner(n % 5 === 0 ? `第 ${n} 波 · 有大个子！` : `第 ${n} 波来了！`, 1600); sWave();
  hud();
}

// ================= 输入 =================
function toWorld(px, py) { return { x: (px - offX) / scale, y: (py - offY) / scale }; }
cv.addEventListener('pointerdown', e => { if (!running || paused) return; input.active = true; input.id = e.pointerId; input.sx = input.x = e.clientX; input.sy = input.y = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (input.active && e.pointerId === input.id) { input.x = e.clientX; input.y = e.clientY; } });
const endPtr = e => { if (e.pointerId === input.id) input.active = false; };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
addEventListener('keydown', e => { input.keys[e.key.toLowerCase()] = true; if (e.key === ' ') startWave(); });
addEventListener('keyup', e => { input.keys[e.key.toLowerCase()] = false; });

// ================= 更新 =================
function update(dt) {
  G.time += dt;
  const h = G.hero;
  // 移动
  let mx = 0, my = 0;
  if (input.active) {
    const dx = input.x - input.sx, dy = input.y - input.sy, l = Math.hypot(dx, dy);
    if (l > 6) { const m = Math.min(1, l / 55); mx = dx / l * m; my = dy / l * m; }
  }
  const k = input.keys;
  if (k['w'] || k['arrowup']) my -= 1; if (k['s'] || k['arrowdown']) my += 1;
  if (k['a'] || k['arrowleft']) mx -= 1; if (k['d'] || k['arrowright']) mx += 1;
  const ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; }
  const speed = 200;
  h.x = Math.max(16, Math.min(WW - 16, h.x + mx * speed * dt));
  h.y = Math.max(16, Math.min(WH - 70, h.y + my * speed * dt));
  if (Math.abs(mx) > .1) h.face = mx > 0 ? 1 : -1;
  h.moving = ml > .1; if (h.moving) h.bob += dt * 12;

  // 英雄自动攻击
  h.atkCd -= dt; h.swing = Math.max(0, h.swing - dt * 4);
  if (h.atkCd <= 0) {
    let best = null, bd = 52;
    for (const e of G.enemies) { const d = dist(h, e); if (d < bd + e.r) { bd = d; best = e; } }
    if (best) { h.atkCd = .45; h.swing = 1; h.face = best.x > h.x ? 1 : -1; damage(best, 9); }
  }

  // 刷怪
  if (G.waveActive) {
    G.spawnT -= dt;
    if (G.toSpawn.length && G.spawnT <= 0) {
      const d = G.toSpawn.shift(); G.spawnT = G.spawnGap;
      G.enemies.push({ ...d, maxHp: d.hp, s: 0, x: PATH[0][0], y: PATH[0][1], bob: rand(0, 6), hit: 0 });
    }
    if (!G.toSpawn.length && !G.enemies.length) {
      G.waveActive = false;
      if (G.wave >= 20) return endGame(true);
      const bonus = 10 + G.wave * 2; G.coins += bonus;
      floatText(h.x, h.y - 30, `+${bonus} 过关奖励`, '#ffd24a');
      G.countdown = 10; hud();
    }
  } else if (G.countdown > 0) {
    G.countdown -= dt; if (G.countdown <= 0) startWave();
  }

  // 敌人移动
  for (const e of G.enemies) {
    e.s += e.spd * dt; const p = posAt(e.s); e.x = p.x; e.y = p.y; e.bob += dt * 10; e.hit = Math.max(0, e.hit - dt * 5);
    if (e.s >= PATH_LEN) {
      e.dead = true; e.reached = true;
      if (!G.easy) { G.castleHp -= e.boss ? 5 : 1; G.castleFlash = 1; sHit(); hud(); if (G.castleHp <= 0) { G.castleHp = 0; hud(); return endGame(false); } }
      else { G.castleFlash = .6; }
    }
  }
  G.castleFlash = Math.max(0, G.castleFlash - dt * 2);

  // 塔
  for (const p of G.pads) {
    p.flash = Math.max(0, p.flash - dt * 2);
    if (!p.level) continue;
    const T = TOWER[p.type], rng = T.range[p.level];
    p.cd -= dt;
    let tgt = null, far = -1;
    for (const e of G.enemies) if (!e.dead && Math.hypot(e.x - p.x, e.y - p.y) < rng && e.s > far) { far = e.s; tgt = e; }
    if (tgt) {
      const want = Math.atan2(tgt.y - p.y, tgt.x - p.x);
      let da = ((want - p.angle + Math.PI * 3) % (Math.PI * 2)) - Math.PI; p.angle += da * Math.min(1, dt * 12);
      if (p.cd <= 0) {
        p.cd = 1 / T.rate[p.level];
        G.shots.push({ type: p.type, x: p.x, y: p.y - 10, tgt, tx: tgt.x, ty: tgt.y, dmg: T.dmg[p.level], spd: p.type === 'arrow' ? 720 : 420, splash: T.splash || 0, sx: p.x, sy: p.y - 10 });
        if (p.type === 'cannon') tone(90, .12, .05, 'square');
      }
    }
  }
  // 弹道
  for (const s of G.shots) {
    if (s.tgt && !s.tgt.dead) { s.tx = s.tgt.x; s.ty = s.tgt.y; }
    const dx = s.tx - s.x, dy = s.ty - s.y, l = Math.hypot(dx, dy), step = s.spd * dt;
    if (l <= step) {
      s.done = true;
      if (s.splash) {
        for (const e of G.enemies) if (!e.dead && Math.hypot(e.x - s.tx, e.y - s.ty) < s.splash) damage(e, s.dmg);
        for (let i = 0; i < 10; i++) G.parts.push({ x: s.tx, y: s.ty, vx: rand(-120, 120), vy: rand(-120, 120), life: .45, c: i % 2 ? '#ffb347' : '#8a7a6a', r: rand(3, 6) });
      } else if (s.tgt && !s.tgt.dead) damage(s.tgt, s.dmg);
    } else { s.x += dx / l * step; s.y += dy / l * step; s.ang = Math.atan2(dy, dx); }
  }
  G.shots = G.shots.filter(s => !s.done);
  G.enemies = G.enemies.filter(e => !e.dead);

  // 金币：地上的
  const magnet = G.easy ? 140 : 85;
  for (const c of G.coinsOnGround) {
    c.age += dt;
    if (c.pop > 0) { c.pop -= dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= .9; c.vy *= .9; continue; }
    const d = dist(c, h);
    if (d < magnet || c.age > 20) {
      const sp = 380 + (magnet - Math.min(d, magnet)) * 4;
      c.x += (h.x - c.x) / d * sp * dt; c.y += (h.y - c.y) / d * sp * dt;
      if (d < 16) { c.got = true; G.coins += c.v; sCoin(); bumpCoins(); }
    }
  }
  G.coinsOnGround = G.coinsOnGround.filter(c => !c.got);

  // 建造 / 升级：站在框里自动付钱
  for (const p of G.pads) {
    if (p.level >= 3) continue;
    const on = Math.abs(h.x - p.x) < 34 && Math.abs(h.y - p.y) < 34;
    if (on && G.coins > 0) {
      p.payT -= dt;
      if (p.payT <= 0) {
        p.payT = 1 / 30;
        const step = Math.min(G.coins, p.need - p.paid, Math.max(1, Math.ceil(p.need / 40)));
        G.coins -= step; p.paid += step; bumpCoins();
        G.flyCoins.push({ x: h.x, y: h.y - 10, tx: p.x, ty: p.y, t: 0 });
        if (p.paid >= p.need) {
          p.level++; p.paid = 0; p.need = p.cost * (p.level === 1 ? 2 : 4); p.flash = 1; G.built++;
          sBuild(); floatText(p.x, p.y - 40, p.level === 1 ? TOWER[p.type].name + ' 建好了！' : '升级到 ' + p.level + ' 级！', '#fff');
          for (let i = 0; i < 16; i++) G.parts.push({ x: p.x, y: p.y, vx: rand(-160, 160), vy: rand(-200, 40), life: .6, c: '#ffd24a', r: rand(2, 4) });
        }
      }
    } else p.payT = 0;
  }
  for (const f of G.flyCoins) f.t += dt * 4;
  G.flyCoins = G.flyCoins.filter(f => f.t < 1);

  // 粒子 / 飘字
  for (const q of G.parts) { q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 300 * dt; }
  G.parts = G.parts.filter(q => q.life > 0);
  for (const f of G.floaters) { f.t += dt; f.y -= 30 * dt; }
  G.floaters = G.floaters.filter(f => f.t < 1.4);

  // 波次按钮
  const wb = $('waveBtn');
  if (!G.waveActive && G.wave < 20) {
    wb.style.display = 'block';
    wb.textContent = `第 ${G.wave + 1} 波 · ${Math.ceil(G.countdown)} 秒后来 ▶ 马上开始`;
  } else wb.style.display = 'none';
  if (G.coinsShown !== G.coins) { G.coinsShown = G.coins; $('coinN').textContent = G.coins; }
}

function damage(e, d) {
  if (e.dead) return;
  e.hp -= d; e.hit = 1;
  if (e.hp <= 0) {
    e.dead = true;
    for (let i = 0; i < e.drop; i++) {
      const a = rand(0, Math.PI * 2), v = rand(60, 160);
      G.coinsOnGround.push({ x: e.x, y: e.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, pop: .35, age: 0, v: 1 });
    }
    for (let i = 0; i < 8; i++) G.parts.push({ x: e.x, y: e.y, vx: rand(-100, 100), vy: rand(-140, 20), life: .4, c: '#e8e0d0', r: rand(3, 6) });
  }
}
function floatText(x, y, t, c) { G.floaters.push({ x, y, t: 0, text: t, c }); }
let bumpT = 0;
function bumpCoins() { const n = performance.now(); if (n - bumpT > 150) { bumpT = n; const el = $('coins'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); } }
function hud() {
  $('coinN').textContent = G.coins; $('waveN').textContent = G.wave;
  $('hpBar').style.width = (G.castleHp / G.castleMax * 100) + '%';
  $('hpBar').style.background = G.castleHp > 10 ? '#63d36b' : G.castleHp > 5 ? '#f2c14e' : '#e5484d';
}
let bannerT = null;
function showBanner(t, ms) { const b = $('banner'); b.textContent = t; b.classList.add('show'); clearTimeout(bannerT); bannerT = setTimeout(() => b.classList.remove('show'), ms); }

// ================= 绘制 =================
function W(x) { return x; }
function drawGround() {
  ctx.fillStyle = '#e2c083'; ctx.fillRect(0, 0, WW, WH);
  // 草地斑块
  ctx.fillStyle = 'rgba(140,170,80,.35)';
  [[80,120,70],[520,120,60],[520,500,70],[60,650,60],[480,860,70],[90,900,50],[330,640,40]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.ellipse(x, y, r, r * .7, 0, 0, 7); ctx.fill(); });
  // 路
  const stroke = (w, c) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); PATH.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); };
  stroke(58, '#c9a468'); stroke(48, '#f4e3bb');
  ctx.setLineDash([2, 14]); stroke(3, 'rgba(180,140,80,.5)'); ctx.setLineDash([]);
  // 装饰
  for (const d of DECOR) {
    ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(d.x, d.y + d.r * .7, d.r, d.r * .4, 0, 0, 7); ctx.fill();
    if (d.k === 'tree') {
      ctx.fillStyle = '#7a5430'; ctx.fillRect(d.x - 3, d.y, 6, d.r * .7);
      ctx.fillStyle = '#4f9a47'; ctx.beginPath(); ctx.arc(d.x, d.y - d.r * .2, d.r, 0, 7); ctx.fill();
      ctx.fillStyle = '#6cbf5a'; ctx.beginPath(); ctx.arc(d.x - d.r * .3, d.y - d.r * .5, d.r * .55, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = '#a58e74'; ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r, d.r * .75, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#c4ae93'; ctx.beginPath(); ctx.ellipse(d.x - d.r * .25, d.y - d.r * .25, d.r * .5, d.r * .35, 0, 0, 7); ctx.fill();
    }
  }
  // 入口
  ctx.fillStyle = 'rgba(120,40,30,.25)'; ctx.beginPath(); ctx.ellipse(300, 8, 50, 16, 0, 0, 7); ctx.fill();
}
function drawCastle() {
  const { x, y } = CASTLE, f = G.castleFlash;
  ctx.save(); ctx.translate(x, y);
  if (f > 0) ctx.translate(rand(-3, 3) * f, 0);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0, 40, 130, 18, 0, 0, 7); ctx.fill();
  const wall = f > 0 ? `rgb(${200 + 55 * f},${150 - 50 * f},${130 - 50 * f})` : '#b9a58a';
  ctx.fillStyle = wall; ctx.fillRect(-110, -10, 220, 50);
  ctx.fillStyle = '#9c886e'; for (let i = -110; i < 110; i += 22) ctx.fillRect(i, -22, 14, 14);
  // 两侧塔楼
  for (const s of [-1, 1]) {
    ctx.fillStyle = wall; ctx.fillRect(s * 110 - 22, -40, 44, 80);
    ctx.fillStyle = '#b8453a'; ctx.beginPath(); ctx.moveTo(s * 110 - 28, -40); ctx.lineTo(s * 110, -72); ctx.lineTo(s * 110 + 28, -40); ctx.fill();
  }
  // 城门
  ctx.fillStyle = '#6b4424'; ctx.beginPath(); ctx.moveTo(-24, 40); ctx.lineTo(-24, 6); ctx.arc(0, 6, 24, Math.PI, 0); ctx.lineTo(24, 40); ctx.fill();
  ctx.strokeStyle = '#4a2e17'; ctx.lineWidth = 2; for (let i = -16; i <= 16; i += 8) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 40); ctx.stroke(); }
  // 旗
  ctx.strokeStyle = '#5a4030'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(110, -72); ctx.lineTo(110, -100); ctx.stroke();
  ctx.fillStyle = '#3d7fd6'; ctx.beginPath(); ctx.moveTo(110, -100); ctx.lineTo(110 + 24 + Math.sin(G.time * 5) * 3, -92); ctx.lineTo(110, -84); ctx.fill();
  ctx.restore();
}
function coinShape(x, y, r) {
  ctx.fillStyle = '#c98a12'; ctx.beginPath(); ctx.ellipse(x, y + 1.5, r, r * .9, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffcf3d'; ctx.beginPath(); ctx.ellipse(x, y, r, r * .9, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.ellipse(x - r * .3, y - r * .3, r * .3, r * .25, 0, 0, 7); ctx.fill();
}
function drawPad(p) {
  const s = 62;
  if (p.level < 3) {
    const prog = p.paid / p.need;
    ctx.save(); ctx.translate(p.x, p.y);
    if (!p.level) {
      ctx.fillStyle = 'rgba(120,80,40,.35)'; roundRect(-s / 2, -s / 2, s, s, 8); ctx.fill();
      if (prog > 0) { ctx.fillStyle = 'rgba(255,210,74,.55)'; roundRect(-s / 2, s / 2 - s * prog, s, s * prog, 8); ctx.fill(); }
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.setLineDash([9, 6]); roundRect(-s / 2, -s / 2, s, s, 8); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#fff'; ctx.font = '900 25px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.need - p.paid, -8, -8); coinShape(19, -8, 8);
      ctx.font = '800 16px sans-serif'; ctx.fillText(TOWER[p.type].name, 0, 17);
    }
    ctx.restore();
  }
}
function drawTower(p) {
  if (!p.level) return;
  const { x, y } = p, lv = p.level;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0, 14, 28, 10, 0, 0, 7); ctx.fill();
  // 底座（齿轮石座）
  const baseC = ['#8f8f98', '#9aa7b8', '#c8a74a'][lv - 1];
  ctx.fillStyle = '#5d6270';
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; ctx.beginPath(); ctx.arc(Math.cos(a) * 24, Math.sin(a) * 20 + 4, 6, 0, 7); ctx.fill(); }
  ctx.fillStyle = baseC; ctx.beginPath(); ctx.ellipse(0, 2, 24, 20, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.ellipse(-6, -4, 12, 8, 0, 0, 7); ctx.fill();
  ctx.rotate(p.angle);
  if (p.type === 'arrow') {
    ctx.strokeStyle = '#7a4a22'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(22, 0); ctx.stroke();
    ctx.strokeStyle = '#a0612b'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(12, 0, 16, -Math.PI / 2 - .4, Math.PI / 2 + .4, true); ctx.stroke();
    ctx.strokeStyle = '#eee'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(6, -15); ctx.lineTo(-6, 0); ctx.lineTo(6, 15); ctx.stroke();
  } else {
    ctx.fillStyle = '#3b3f4a'; ctx.fillRect(-4, -8, 30, 16);
    ctx.fillStyle = '#23262e'; ctx.beginPath(); ctx.arc(0, 0, 14, 0, 7); ctx.fill();
    ctx.fillStyle = '#555b69'; ctx.beginPath(); ctx.arc(-3, -3, 5, 0, 7); ctx.fill();
  }
  ctx.restore();
  // 等级星星
  ctx.fillStyle = '#ffd24a'; ctx.font = '900 18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('★'.repeat(lv), x, y + 32);
  // 升级框
  if (lv < 3) {
    const s = 62;
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2.5; ctx.setLineDash([7, 6]); roundRect(x - s / 2, y - s / 2, s, s, 8); ctx.stroke(); ctx.setLineDash([]);
    const prog = p.paid / p.need;
    ctx.fillStyle = 'rgba(43,29,16,.8)'; roundRect(x - 42, y - s / 2 - 28, 84, 25, 12); ctx.fill();
    if (prog > 0) { ctx.fillStyle = '#ffd24a'; roundRect(x - 42, y - s / 2 - 28, 84 * prog, 25, 12); ctx.fill(); }
    ctx.fillStyle = '#fff'; ctx.font = '900 17px sans-serif'; ctx.fillText('升级 ' + (p.need - p.paid), x, y - s / 2 - 15);
  }
  if (p.flash > 0) { ctx.strokeStyle = `rgba(255,230,120,${p.flash})`; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x, y, 30 + (1 - p.flash) * 30, 0, 7); ctx.stroke(); }
}
function drawEnemy(e) {
  const b = Math.sin(e.bob) * 2, r = e.r;
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(e.x, e.y + r * .8, r * .9, r * .35, 0, 0, 7); ctx.fill();
  ctx.fillStyle = e.hit > 0 ? '#fff' : (e.boss ? '#9e1f1f' : '#d8433b');
  ctx.beginPath(); ctx.arc(e.x, e.y - r * .3 + b, r, 0, 7); ctx.fill();
  ctx.fillStyle = e.boss ? '#3a3a3a' : '#6e6e78';   // 头盔
  ctx.beginPath(); ctx.arc(e.x, e.y - r * .75 + b, r * .7, Math.PI, 0); ctx.fill();
  if (e.boss) { ctx.fillStyle = '#eee'; ctx.beginPath(); ctx.moveTo(e.x - r * .7, e.y - r + b); ctx.lineTo(e.x - r * 1.1, e.y - r * 1.6 + b); ctx.lineTo(e.x - r * .35, e.y - r * 1.1 + b); ctx.fill();
    ctx.beginPath(); ctx.moveTo(e.x + r * .7, e.y - r + b); ctx.lineTo(e.x + r * 1.1, e.y - r * 1.6 + b); ctx.lineTo(e.x + r * .35, e.y - r * 1.1 + b); ctx.fill(); }
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(e.x - r * .3, e.y - r * .3 + b, r * .18, 0, 7); ctx.arc(e.x + r * .3, e.y - r * .3 + b, r * .18, 0, 7); ctx.fill();
  if (e.hp < e.maxHp) {
    const w = r * 2.2; ctx.fillStyle = '#3a2a1a'; ctx.fillRect(e.x - w / 2, e.y - r * 2 - 6, w, 5);
    ctx.fillStyle = '#6ee06e'; ctx.fillRect(e.x - w / 2, e.y - r * 2 - 6, w * Math.max(0, e.hp / e.maxHp), 5);
  }
}
function drawHero() {
  const h = G.hero, b = h.moving ? Math.abs(Math.sin(h.bob)) * 3 : 0;
  ctx.save(); ctx.translate(h.x, h.y);
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0, 18, 21, 8, 0, 0, 7); ctx.fill();
  ctx.scale(h.face * 1.35, 1.35);
  // 披风
  ctx.fillStyle = '#2f6fd0'; ctx.beginPath(); ctx.moveTo(-6, -12 - b); ctx.lineTo(-18, 12); ctx.lineTo(6, 12); ctx.fill();
  // 身体
  ctx.fillStyle = '#3d86e8'; ctx.beginPath(); ctx.ellipse(0, 2 - b, 11, 13, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#f1c9a0'; ctx.beginPath(); ctx.arc(2, -14 - b, 9, 0, 7); ctx.fill();
  ctx.fillStyle = '#2b1d10'; ctx.beginPath(); ctx.arc(5, -15 - b, 1.6, 0, 7); ctx.fill();
  // 王冠
  ctx.fillStyle = '#ffcf3d'; ctx.beginPath(); ctx.moveTo(-7, -20 - b); ctx.lineTo(-7, -28 - b); ctx.lineTo(-3, -24 - b); ctx.lineTo(1, -30 - b); ctx.lineTo(5, -24 - b); ctx.lineTo(9, -28 - b); ctx.lineTo(9, -20 - b); ctx.fill();
  // 剑
  ctx.save(); ctx.translate(10, -2 - b); ctx.rotate(-1.1 + h.swing * 2.2);
  ctx.fillStyle = '#ddd'; ctx.fillRect(0, -2, 22, 4); ctx.fillStyle = '#7a4a22'; ctx.fillRect(-6, -3, 7, 6);
  ctx.restore();
  if (h.swing > .3) { ctx.strokeStyle = `rgba(255,255,255,${h.swing * .8})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(8, -2, 30, -1.2, 1.0); ctx.stroke(); }
  ctx.restore();
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#caa56a'; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
  drawGround();
  if (!G) return;
  for (const p of G.pads) drawPad(p);
  // 新手提示箭头
  if (G.built === 0) {
    const p = G.pads.reduce((a, b) => a.need < b.need ? a : b), yb = Math.sin(G.time * 6) * 6;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(p.x, p.y - 38 + yb); ctx.lineTo(p.x - 14, p.y - 60 + yb); ctx.lineTo(p.x - 6, p.y - 60 + yb); ctx.lineTo(p.x - 6, p.y - 80 + yb); ctx.lineTo(p.x + 6, p.y - 80 + yb); ctx.lineTo(p.x + 6, p.y - 60 + yb); ctx.lineTo(p.x + 14, p.y - 60 + yb); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.font = '900 23px sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(43,29,16,.8)';
    ctx.strokeText('站到框里建塔', p.x, p.y - 92 + yb); ctx.fillText('站到框里建塔', p.x, p.y - 92 + yb);
  }
  for (const c of G.coinsOnGround) coinShape(c.x, c.y, 7.5);
  // 按 y 排序画物体
  const objs = [...G.pads.filter(p => p.level).map(p => ({ y: p.y, f: () => drawTower(p) })),
    ...G.enemies.map(e => ({ y: e.y, f: () => drawEnemy(e) })), { y: G.hero.y, f: drawHero }];
  objs.sort((a, b) => a.y - b.y).forEach(o => o.f());
  drawCastle();
  // 弹道
  for (const s of G.shots) {
    if (s.type === 'arrow') { ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.ang || 0); ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(6, 0); ctx.stroke(); ctx.fillStyle = '#ccc'; ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(4, -3); ctx.lineTo(4, 3); ctx.fill(); ctx.restore(); }
    else { ctx.fillStyle = '#23262e'; ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, 7); ctx.fill(); }
  }
  for (const f of G.flyCoins) { const t = f.t; coinShape(f.x + (f.tx - f.x) * t, f.y + (f.ty - f.y) * t - Math.sin(t * Math.PI) * 30, 6); }
  for (const q of G.parts) { ctx.globalAlpha = Math.min(1, q.life * 2.5); ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const f of G.floaters) {
    ctx.globalAlpha = Math.min(1, (1.4 - f.t) * 2); ctx.font = '900 24px sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(43,29,16,.85)'; ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.c; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  // 虚拟摇杆
  if (input.active && running && !paused) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(input.sx, input.sy, 55, 0, 7); ctx.fill(); ctx.stroke();
    let dx = input.x - input.sx, dy = input.y - input.sy; const l = Math.hypot(dx, dy); if (l > 55) { dx = dx / l * 55; dy = dy / l * 55; }
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(input.sx + dx, input.sy + dy, 24, 0, 7); ctx.fill();
  }
}

// ================= 结束 / 菜单 =================
function best(mode) { try { return +localStorage.getItem('ch_best_' + mode) || 0; } catch (e) { return 0; } }
function setBest(mode, v) { try { if (v > best(mode)) localStorage.setItem('ch_best_' + mode, v); } catch (e) {} }
function endGame(win) {
  running = false; input.active = false; $('waveBtn').style.display = 'none';
  const survived = win ? 20 : G.wave - 1;
  setBest(G.mode, win ? 20 : Math.max(0, survived));
  $('endTitle').textContent = win ? '🏆 守住了！' : '城堡被攻破了';
  $('endText').innerHTML = win ? `20 波全部挡住！<br>你是真正的守城英雄。` : `坚持到了第 ${G.wave} 波。<br>多建几座塔、记得升级，再试一次！`;
  if (win) sBuild();
  setTimeout(() => $('endOv').classList.add('show'), win ? 300 : 700);
}
function showMenu() {
  running = false; G = null;
  ['endOv', 'pauseOv'].forEach(id => $(id).classList.remove('show'));
  $('waveBtn').style.display = 'none';
  const e = best('easy'), h = best('hard');
  $('rec').textContent = (e || h) ? `最好成绩：轻松 ${e} 波 · 挑战 ${h} 波` : '';
  $('menu').classList.add('show');
}
$('easyBtn').onclick = () => newGame('easy');
$('hardBtn').onclick = () => newGame('hard');
$('againBtn').onclick = () => newGame(G ? G.mode : 'easy');
$('menuBtn').onclick = showMenu;
$('quitBtn').onclick = showMenu;
$('waveBtn').onclick = startWave;
const soundLabel = () => $('soundBtn').textContent = soundOn ? '🔊 声音：开' : '🔈 声音：关';
soundLabel();
$('soundBtn').onclick = () => { soundOn = !soundOn; try { localStorage.setItem('ch_sound', soundOn ? '1' : '0'); } catch (e) {} soundLabel(); };
$('pauseBtn').onclick = () => { if (!running) return; paused = true; input.active = false; $('pauseOv').classList.add('show'); };
$('resumeBtn').onclick = () => { paused = false; $('pauseOv').classList.remove('show'); };
document.addEventListener('visibilitychange', () => { if (document.hidden && running) { paused = true; $('pauseOv').classList.add('show'); } });

// ================= 主循环 =================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G && running && !paused) update(dt);
  draw();
  requestAnimationFrame(loop);
}
showMenu();
requestAnimationFrame(loop);
})();
</script>
