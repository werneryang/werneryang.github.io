<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8a5236">
<title>守城小英雄</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#7c4a31;overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#2b1d10}
  canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 8px 0;display:flex;gap:6px;align-items:center;justify-content:space-between;pointer-events:none}
  .pill{background:linear-gradient(#4a3320,#2f2014);color:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:6px;white-space:nowrap;
    box-shadow:0 2px 0 #1c120a, inset 0 1px 0 rgba(255,255,255,.18);border:2px solid #6b4a2c}
  .coin-ic{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c0,#ffcf3d 45%,#c98a12);box-shadow:0 0 0 2px #a86f0c;display:inline-block}
  #coins.bump{animation:bump .25s ease}
  @keyframes bump{50%{transform:scale(1.15)}}
  #hpPill .bar{width:56px;height:12px;border-radius:6px;background:#1c120a;overflow:hidden;box-shadow:inset 0 1px 2px #000}
  #hpPill .bar i{display:block;height:100%;background:linear-gradient(#8df08a,#3fb64a);transition:width .2s}
  .icon-btn{flex:none;pointer-events:auto;border:2px solid #6b4a2c;background:linear-gradient(#4a3320,#2f2014);color:#fff;font-size:17px;width:40px;height:40px;border-radius:50%;cursor:pointer;box-shadow:0 2px 0 #1c120a}
  #banner{position:fixed;left:50%;top:40%;transform:translateX(-50%) scale(.9);font-size:36px;font-weight:900;color:#fff;letter-spacing:1px;
    text-shadow:0 3px 0 #7a2a1a,0 0 14px rgba(0,0,0,.5);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s, transform .3s}
  #banner.show{opacity:1;transform:translateX(-50%) scale(1)}
  #waveBtn{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;
    border:2px solid #ff9a86;border-radius:999px;padding:11px 22px;font-size:19px;font-weight:800;color:#fff;background:linear-gradient(#e2513f,#b8301f);box-shadow:0 5px 0 #7d2319;cursor:pointer;white-space:nowrap}
  #waveBtn:active{transform:translateX(-50%) translateY(3px);box-shadow:0 2px 0 #7d2319}
  .ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;
    background:rgba(40,24,12,.74);backdrop-filter:blur(4px);color:#fff}
  .ov.show{display:flex}
  .ov h1{margin:0;font-size:46px;font-weight:900;text-shadow:0 4px 0 #7a2a1a,0 0 24px rgba(255,190,90,.45)}
  .ov h2{margin:0;font-size:34px;font-weight:900}
  .ov p{margin:0;font-size:19px;line-height:1.6;max-width:420px;color:#f3e6cf}
  .ov .rec{font-size:17px;color:#ffd978}
  .ov button{border:0;border-radius:18px;font-size:24px;font-weight:900;padding:16px 26px;min-width:280px;cursor:pointer;color:#2b1d10;background:linear-gradient(#ffe07a,#f6b92b);box-shadow:0 6px 0 #b8871a}
  .ov button.alt{background:linear-gradient(#fff,#e9dcc6);box-shadow:0 6px 0 #bba98c}
  .ov button small{display:block;font-size:15px;font-weight:700;opacity:.75;margin-top:2px}
  .ov button:active{transform:translateY(4px);box-shadow:0 2px 0 #b8871a}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="pill" id="coins"><span class="coin-ic"></span><span id="coinN">0</span></div>
  <div class="pill" id="waveP">波 <span id="waveN">0</span>/20</div>
  <div class="pill" id="hpPill">🏰 <div class="bar"><i id="hpBar"></i></div></div>
  <button class="icon-btn" id="pauseBtn" aria-label="暂停">⏸</button>
</div>
<div id="banner"></div>
<button id="waveBtn"></button>

<div class="ov show" id="menu">
  <h1>守城小英雄</h1>
  <p>手指按住屏幕拖动，小英雄就会走。<br>捡金币，站到虚线框里建塔，守住城堡！</p>
  <button id="easyBtn">轻松模式<small>敌人慢、金币多，城堡不会被打破</small></button>
  <button class="alt" id="hardBtn">挑战模式<small>守住 20 波，城堡被打破就输</small></button>
  <div class="rec" id="rec"></div>
</div>
<div class="ov" id="pauseOv">
  <h2>暂停中</h2>
  <button id="resumeBtn">继续玩</button>
  <button class="alt" id="soundBtn"></button>
  <button class="alt" id="quitBtn">回到开始画面</button>
</div>
<div class="ov" id="endOv">
  <h2 id="endTitle"></h2>
  <p id="endText"></p>
  <button id="againBtn">再玩一次</button>
  <button class="alt" id="menuBtn">回到开始画面</button>
</div>

<script>
(() => {
// ================= 基础 =================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const WW = 600, WH = 960;
let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const topPad = 54, botPad = 64;
  scale = Math.min(innerWidth / WW, (innerHeight - topPad - botPad) / WH);
  offX = (innerWidth - WW * scale) / 2; offY = topPad + (innerHeight - topPad - botPad - WH * scale) / 2;
}
addEventListener('resize', resize); resize();
const rand = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function seeded(s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; }
let soundOn = true;
try { soundOn = localStorage.getItem('ch_sound') !== '0'; } catch (e) {}

// ================= 声音 =================
let ac = null, lastCoinSnd = 0;
function tone(f, len, vol = 0.06, type = 'sine', st = 0) {
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + st, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + len + 0.05);
  } catch (e) {}
}
const sCoin = () => { const n = performance.now(); if (n - lastCoinSnd > 70) { lastCoinSnd = n; tone(1320 + rand(-60, 60), 0.08, 0.03, 'triangle'); } };
const sBuild = () => { tone(523, .15, .08); tone(659, .15, .08, 'sine', .1); tone(784, .3, .08, 'sine', .2); };
const sHit = () => tone(140, .25, .1, 'square');
const sWave = () => { tone(392, .25, .07, 'sawtooth'); tone(523, .4, .07, 'sawtooth', .22); };

// ================= 地图：平滑弯路 =================
const CTRL = [[300,-50],[300,80],[160,165],[105,290],[190,395],[420,425],[500,535],[430,640],[190,665],[125,765],[205,845],[300,855],[300,885]];
function chaikin(pts, it) {
  for (let k = 0; k < it; k++) {
    const out = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) {
      const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
      out.push([x1 * .75 + x2 * .25, y1 * .75 + y2 * .25], [x1 * .25 + x2 * .75, y1 * .25 + y2 * .75]);
    }
    out.push(pts[pts.length - 1]); pts = out;
  }
  return pts;
}
const PATH = chaikin(CTRL, 3);
const SEG = []; let PATH_LEN = 0;
for (let i = 0; i < PATH.length - 1; i++) {
  const [x1, y1] = PATH[i], [x2, y2] = PATH[i + 1], l = Math.hypot(x2 - x1, y2 - y1);
  if (l < .01) continue;
  SEG.push({ x1, y1, x2, y2, l, s: PATH_LEN }); PATH_LEN += l;
}
function posAt(s) {
  s = Math.max(0, Math.min(PATH_LEN, s));
  let lo = 0, hi = SEG.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (SEG[m].s + SEG[m].l < s) lo = m + 1; else hi = m; }
  const g = SEG[lo], t = (s - g.s) / g.l;
  return { x: g.x1 + (g.x2 - g.x1) * t, y: g.y1 + (g.y2 - g.y1) * t, dx: (g.x2 - g.x1) / g.l, dy: (g.y2 - g.y1) / g.l };
}
function distToPath(x, y) {
  let m = 1e9;
  for (const g of SEG) {
    const dx = g.x2 - g.x1, dy = g.y2 - g.y1, t = Math.max(0, Math.min(1, ((x - g.x1) * dx + (y - g.y1) * dy) / (g.l * g.l)));
    m = Math.min(m, Math.hypot(x - g.x1 - dx * t, y - g.y1 - dy * t));
  }
  return m;
}
const CASTLE = { x: 300, y: 905 };
const TOWER = {
  arrow:  { range: [0, 150, 170, 195], dmg: [0, 10, 18, 30], rate: [0, 1.1, 1.5, 2.0], name: '弩塔' },
  cannon: { range: [0, 140, 150, 165], dmg: [0, 22, 40, 65], rate: [0, .55, .7, .85], splash: 58, name: '炮塔' },
};

// 自动挑选塔位：每个位置都必须能打到一大段路，并且互相错开
const PAD_DEFS = (() => {
  const samples = []; for (let s = 70; s < PATH_LEN - 30; s += 8) { const p = posAt(s); samples.push({ x: p.x, y: p.y, w: 1 }); }
  const cands = [];
  for (let x = 100; x <= 500; x += 10) for (let y = 120; y <= 800; y += 10) {
    const d = distToPath(x, y);
    if (d < 54 || d > 92) continue;
    if (Math.hypot(x - CASTLE.x, y - CASTLE.y) < 150) continue;
    cands.push({ x, y });
  }
  const cover = (c, r, weighted) => samples.reduce((a, s) => a + (Math.hypot(s.x - c.x, s.y - c.y) < r ? (weighted ? s.w : 1) : 0), 0);
  const picked = [];
  for (let k = 0; k < 8; k++) {
    let best = null, bs = -1;
    for (const c of cands) {
      if (picked.some(p => Math.hypot(p.x - c.x, p.y - c.y) < 112)) continue;
      const sc = cover(c, 145, true); if (sc > bs) { bs = sc; best = c; }
    }
    if (!best) break;
    picked.push(best);
    for (const s of samples) if (Math.hypot(s.x - best.x, s.y - best.y) < 145) s.w *= .3;
  }
  // 覆盖最多的两个位置给炮塔，其余给弩塔（离城堡近的便宜）
  const byCover = picked.slice().sort((a, b) => cover(b, 140) - cover(a, 140));
  const cannons = byCover.slice(0, 2), arrows = picked.filter(p => !cannons.includes(p));
  arrows.sort((a, b) => Math.hypot(a.x - 300, a.y - 780) - Math.hypot(b.x - 300, b.y - 780));
  const out = [];
  arrows.forEach((p, i) => out.push({ x: p.x, y: p.y, type: 'arrow', cost: 20 + i * 10 }));
  cannons.forEach((p, i) => out.push({ x: p.x, y: p.y, type: 'cannon', cost: 100 + i * 20 }));
  return out;
})();

// ================= 游戏状态 =================
let G = null, running = false, paused = false;
const input = { active: false, sx: 0, sy: 0, x: 0, y: 0, keys: {} };

function newGame(mode) {
  const easy = mode === 'easy';
  G = {
    mode, easy,
    coins: 30, castleHp: 20, castleMax: 20, castleFlash: 0,
    hero: { x: 300, y: 780, face: 1, atkCd: 0, swing: 0, bob: 0 },
    pads: PAD_DEFS.map(p => ({ ...p, level: 0, paid: 0, need: p.cost, payT: 0, cd: 0, angle: -Math.PI / 2, flash: 0, recoil: 0 })),
    enemies: [], coinsOnGround: [], shots: [], parts: [], floaters: [], flyCoins: [],
    wave: 0, waveActive: false, toSpawn: [], spawnT: 0, countdown: 15, time: 0, built: 0,
  };
  running = true; paused = false;
  ['menu', 'endOv', 'pauseOv'].forEach(id => $(id).classList.remove('show'));
  $('hpPill').style.display = easy ? 'none' : '';
  hud(); showBanner('捡金币、建塔、守城堡！', 2200);
}

function startWave() {
  if (!G || G.waveActive) return;
  if (G.countdown > 1 && G.wave > 0) { const b = Math.floor(G.countdown); if (b > 0) { G.coins += b; floatText(G.hero.x, G.hero.y - 40, '+' + b + ' 提前奖励', '#ffd24a'); } }
  G.wave++; G.waveActive = true; G.countdown = 0;
  const n = G.wave, cnt = 6 + n * 2;
  const hp = 14 * Math.pow(1.155, n - 1), spd = (45 + n * 1.3) * (G.easy ? .65 : 1);
  G.toSpawn = [];
  for (let i = 0; i < cnt; i++) G.toSpawn.push({ hp, spd: spd * rand(.92, 1.08), r: 13, boss: false, drop: G.easy ? 3 : 2 });
  if (n % 5 === 0) G.toSpawn.push({ hp: hp * 6, spd: spd * .7, r: 23, boss: true, drop: 15 });
  G.spawnGap = Math.max(.4, 1.1 - n * .03); G.spawnT = 0;
  showBanner(n % 5 === 0 ? `第 ${n} 波 · 有大个子！` : `第 ${n} 波来了！`, 1600); sWave();
  hud();
}

// ================= 输入 =================
cv.addEventListener('pointerdown', e => { if (!running || paused) return; input.active = true; input.id = e.pointerId; input.sx = input.x = e.clientX; input.sy = input.y = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (input.active && e.pointerId === input.id) { input.x = e.clientX; input.y = e.clientY; } });
const endPtr = e => { if (e.pointerId === input.id) input.active = false; };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
addEventListener('keydown', e => { input.keys[e.key.toLowerCase()] = true; if (e.key === ' ') startWave(); });
addEventListener('keyup', e => { input.keys[e.key.toLowerCase()] = false; });

// ================= 更新 =================
function update(dt) {
  G.time += dt;
  const h = G.hero;
  let mx = 0, my = 0;
  if (input.active) {
    const dx = input.x - input.sx, dy = input.y - input.sy, l = Math.hypot(dx, dy);
    if (l > 6) { const m = Math.min(1, l / 55); mx = dx / l * m; my = dy / l * m; }
  }
  const k = input.keys;
  if (k['w'] || k['arrowup']) my -= 1; if (k['s'] || k['arrowdown']) my += 1;
  if (k['a'] || k['arrowleft']) mx -= 1; if (k['d'] || k['arrowright']) mx += 1;
  const ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; }
  const speed = 205;
  h.x = Math.max(58, Math.min(WW - 58, h.x + mx * speed * dt));
  h.y = Math.max(70, Math.min(WH - 80, h.y + my * speed * dt));
  if (Math.abs(mx) > .1) h.face = mx > 0 ? 1 : -1;
  h.moving = ml > .1; if (h.moving) { h.bob += dt * 12; if (Math.random() < dt * 9) G.parts.push({ x: h.x, y: h.y + 14, vx: rand(-15, 15), vy: rand(-20, -5), life: .45, c: 'rgba(240,225,190,.8)', r: rand(3, 6), dust: true }); }

  // 英雄自动攻击
  h.atkCd -= dt; h.swing = Math.max(0, h.swing - dt * 4);
  if (h.atkCd <= 0) {
    let best = null, bd = 56;
    for (const e of G.enemies) { const d = dist(h, e); if (d < bd + e.r) { bd = d; best = e; } }
    if (best) { h.atkCd = .45; h.swing = 1; h.face = best.x > h.x ? 1 : -1; damage(best, 9 + G.wave * .6); }
  }

  // 刷怪
  if (G.waveActive) {
    G.spawnT -= dt;
    if (G.toSpawn.length && G.spawnT <= 0) {
      const d = G.toSpawn.shift(); G.spawnT = G.spawnGap;
      G.enemies.push({ ...d, maxHp: d.hp, s: 0, x: PATH[0][0], y: PATH[0][1], bob: rand(0, 6), hit: 0, dirx: 0 });
    }
    if (!G.toSpawn.length && !G.enemies.length) {
      G.waveActive = false;
      if (G.wave >= 20) return endGame(true);
      const bonus = 12 + G.wave * 3; G.coins += bonus;
      floatText(h.x, h.y - 40, `+${bonus} 过关奖励`, '#ffd24a');
      G.countdown = 10; hud();
    }
  } else if (G.countdown > 0) {
    G.countdown -= dt; if (G.countdown <= 0) startWave();
  }

  // 敌人移动
  for (const e of G.enemies) {
    e.s += e.spd * dt; const p = posAt(e.s); e.x = p.x; e.y = p.y; e.dirx = p.dx; e.bob += dt * 10; e.hit = Math.max(0, e.hit - dt * 5);
    if (e.s >= PATH_LEN) {
      e.dead = true;
      if (!G.easy) { G.castleHp -= e.boss ? 5 : 1; G.castleFlash = 1; sHit(); hud(); if (G.castleHp <= 0) { G.castleHp = 0; hud(); return endGame(false); } }
      else G.castleFlash = .6;
    }
  }
  G.castleFlash = Math.max(0, G.castleFlash - dt * 2);

  // 塔
  for (const p of G.pads) {
    p.flash = Math.max(0, p.flash - dt * 2); p.recoil = Math.max(0, p.recoil - dt * 6);
    if (!p.level) continue;
    const T = TOWER[p.type], rng = T.range[p.level];
    p.cd -= dt;
    let tgt = null, far = -1;
    for (const e of G.enemies) if (!e.dead && Math.hypot(e.x - p.x, e.y - p.y) < rng && e.s > far) { far = e.s; tgt = e; }
    if (tgt) {
      const want = Math.atan2(tgt.y - p.y, tgt.x - p.x);
      const da = ((want - p.angle + Math.PI * 3) % (Math.PI * 2)) - Math.PI; p.angle += da * Math.min(1, dt * 12);
      if (p.cd <= 0) {
        p.cd = 1 / T.rate[p.level]; p.recoil = 1;
        G.shots.push({ type: p.type, x: p.x + Math.cos(p.angle) * 20, y: p.y - 12 + Math.sin(p.angle) * 20, tgt, tx: tgt.x, ty: tgt.y, dmg: T.dmg[p.level], spd: p.type === 'arrow' ? 760 : 430, splash: T.splash || 0 });
        if (p.type === 'cannon') { tone(90, .12, .05, 'square'); for (let i = 0; i < 5; i++) G.parts.push({ x: p.x + Math.cos(p.angle) * 26, y: p.y - 12 + Math.sin(p.angle) * 26, vx: Math.cos(p.angle) * rand(40, 110) + rand(-30, 30), vy: Math.sin(p.angle) * rand(40, 110) + rand(-30, 30), life: .4, c: 'rgba(230,225,215,.9)', r: rand(4, 8), dust: true }); }
      }
    }
  }
  // 弹道
  for (const s of G.shots) {
    if (s.tgt && !s.tgt.dead) { s.tx = s.tgt.x; s.ty = s.tgt.y - 6; }
    const dx = s.tx - s.x, dy = s.ty - s.y, l = Math.hypot(dx, dy), step = s.spd * dt;
    if (l <= step) {
      s.done = true;
      if (s.splash) {
        for (const e of G.enemies) if (!e.dead && Math.hypot(e.x - s.tx, e.y - s.ty) < s.splash) damage(e, s.dmg);
        G.parts.push({ x: s.tx, y: s.ty, vx: 0, vy: 0, life: .3, ring: s.splash });
        for (let i = 0; i < 12; i++) G.parts.push({ x: s.tx, y: s.ty, vx: rand(-130, 130), vy: rand(-150, 30), life: .5, c: i % 3 ? 'rgba(235,225,205,.9)' : '#ffb347', r: rand(4, 8), dust: i % 3 > 0 });
      } else if (s.tgt && !s.tgt.dead) damage(s.tgt, s.dmg);
    } else { s.x += dx / l * step; s.y += dy / l * step; s.ang = Math.atan2(dy, dx); }
  }
  G.shots = G.shots.filter(s => !s.done);
  G.enemies = G.enemies.filter(e => !e.dead);

  // 金币
  const magnet = G.easy ? 150 : 95;
  for (const c of G.coinsOnGround) {
    c.age += dt;
    if (c.pop > 0) { c.pop -= dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= .9; c.vy *= .9; c.x = Math.max(50, Math.min(WW - 50, c.x)); continue; }
    const d = dist(c, h);
    if (d < magnet || c.age > 14) {
      const sp = 400 + (magnet - Math.min(d, magnet)) * 4;
      c.x += (h.x - c.x) / d * sp * dt; c.y += (h.y - c.y) / d * sp * dt;
      if (d < 18) { c.got = true; G.coins += c.v; sCoin(); bumpCoins(); }
    }
  }
  G.coinsOnGround = G.coinsOnGround.filter(c => !c.got);

  // 建造 / 升级
  for (const p of G.pads) {
    if (p.level >= 3) continue;
    const on = Math.abs(h.x - p.x) < 36 && Math.abs(h.y - p.y) < 36;

    ctx.fillStyle = '#fff'; ctx.font = '900 16px sans-serif'; ctx.fillText('升级 ' + (p.need - p.paid), x - 8, y - 48 + yb); coinShape(x + 30, y - 49 + yb, 6.5);
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]); ctx.lineDashOffset = -G.time * 12; rr(x - 34, y - 34, 68, 68, 10); ctx.stroke(); ctx.setLineDash([]);
  }
  if (p.flash > 0) { ctx.strokeStyle = `rgba(255,230,120,${p.flash})`; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x, y, 30 + (1 - p.flash) * 34, 0, 7); ctx.stroke(); }
}
function drawEnemy(e) {
  const r = e.r, b = Math.abs(Math.sin(e.bob)) * 2.5, f = e.dirx < -.2 ? -1 : 1, white = e.hit > 0;
  shadow(e.x + 3, e.y + r * .85, r * 1.05, r * .4, .28);
  ctx.save(); ctx.translate(e.x, e.y - b); ctx.scale(f, 1);
  const body = e.boss ? ['#8e2a55', '#5c1636'] : ['#b24a3a', '#7d2a20'], col = white ? '#fff' : null;
  // 脚
  ctx.fillStyle = col || '#3a2418'; const st = Math.sin(e.bob) * r * .25;
  ctx.beginPath(); ctx.ellipse(-r * .35 + st, r * .7 + b, r * .28, r * .18, 0, 0, 7); ctx.ellipse(r * .35 - st, r * .7 + b, r * .28, r * .18, 0, 0, 7); ctx.fill();
  // 身体
  const bg = ctx.createLinearGradient(0, -r * .4, 0, r * .8); bg.addColorStop(0, body[0]); bg.addColorStop(1, body[1]);
  ctx.fillStyle = col || bg; rr(-r * .72, -r * .35, r * 1.44, r * 1.05, r * .45); ctx.fill();
  ctx.strokeStyle = 'rgba(50,15,10,.55)'; ctx.lineWidth = 1.5; rr(-r * .72, -r * .35, r * 1.44, r * 1.05, r * .45); ctx.stroke();
  ctx.fillStyle = col || '#3a2418'; ctx.fillRect(-r * .72, r * .22, r * 1.44, r * .16);          // 腰带
  // 盾 / 武器
  ctx.fillStyle = col || '#7a8696'; ctx.beginPath(); ctx.ellipse(r * .7, r * .12, r * .42, r * .5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = col || '#c7d0dc'; ctx.beginPath(); ctx.ellipse(r * .64, r * .06, r * .2, r * .25, 0, 0, 7); ctx.fill();
  // 头
  ctx.fillStyle = col || '#e9bd92'; ctx.beginPath(); ctx.arc(0, -r * .62, r * .6, 0, 7); ctx.fill();
  ctx.fillStyle = col || (e.boss ? '#3b3f4a' : '#6f7a8a'); ctx.beginPath(); ctx.arc(0, -r * .72, r * .64, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath(); ctx.fill();
  ctx.fillStyle = col || 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.ellipse(-r * .2, -r * 1.1, r * .22, r * .1, -.4, 0, 7); ctx.fill();
  if (e.boss) { ctx.fillStyle = col || '#efe6d2'; [[-1], [1]].forEach(([s]) => { ctx.beginPath(); ctx.moveTo(s * r * .5, -r * 1.05); ctx.quadraticCurveTo(s * r * 1.15, -r * 1.25, s * r * .95, -r * 1.75); ctx.quadraticCurveTo(s * r * .75, -r * 1.3, s * r * .3, -r * 1.2); ctx.fill(); }); }
  if (!white) { ctx.fillStyle = '#2b1d10'; ctx.beginPath(); ctx.arc(r * .12, -r * .58, r * .09, 0, 7); ctx.arc(r * .42, -r * .58, r * .09, 0, 7); ctx.fill();
    ctx.strokeStyle = '#2b1d10'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(r * .0, -r * .76); ctx.lineTo(r * .22, -r * .68); ctx.moveTo(r * .55, -r * .76); ctx.lineTo(r * .34, -r * .68); ctx.stroke(); }
  ctx.restore();
  if (e.hp < e.maxHp) {
    const w = r * 2.4, yy = e.y - r * 2.15 - b - (e.boss ? r * .7 : 0);
    ctx.fillStyle = 'rgba(30,18,10,.85)'; rr(e.x - w / 2 - 1.5, yy - 1.5, w + 3, 8, 4); ctx.fill();
    ctx.fillStyle = e.hp / e.maxHp > .5 ? '#6ee06e' : e.hp / e.maxHp > .25 ? '#f2c14e' : '#ee5a4e'; rr(e.x - w / 2, yy, Math.max(3, w * Math.max(0, e.hp / e.maxHp)), 5, 2.5); ctx.fill();
  }
}
function drawHero() {
  const h = G.hero, b = h.moving ? Math.abs(Math.sin(h.bob)) * 3 : Math.sin(G.time * 3) * .8, S = 1.4;
  shadow(h.x + 4, h.y + 17, 20, 8, .32);
  ctx.save(); ctx.translate(h.x, h.y - b); ctx.scale(h.face * S, S);
  // 披风（会飘）
  const wv = Math.sin(G.time * 8) * (h.moving ? 4 : 1.5);
  ctx.fillStyle = '#1f7d73'; ctx.beginPath(); ctx.moveTo(-5, -9); ctx.quadraticCurveTo(-16 - wv, 0, -15 - wv, 13); ctx.lineTo(-2, 11); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2aa598'; ctx.beginPath(); ctx.moveTo(-5, -9); ctx.quadraticCurveTo(-11 - wv * .6, 0, -9 - wv * .6, 12); ctx.lineTo(-2, 11); ctx.closePath(); ctx.fill();
  // 脚
  const st = h.moving ? Math.sin(h.bob) * 3 : 0;
  ctx.fillStyle = '#4a2f1c'; ctx.beginPath(); ctx.ellipse(-3 + st, 12 + b, 4, 2.6, 0, 0, 7); ctx.ellipse(4 - st, 12 + b, 4, 2.6, 0, 0, 7); ctx.fill();
  // 身体（铠甲）
  const ag = ctx.createLinearGradient(0, -8, 0, 11); ag.addColorStop(0, '#e6ebf2'); ag.addColorStop(1, '#8f9bad');
  ctx.fillStyle = ag; rr(-8, -8, 16, 19, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(40,50,70,.6)'; ctx.lineWidth = 1.2; rr(-8, -8, 16, 19, 6); ctx.stroke();
  ctx.fillStyle = '#c0392b'; ctx.fillRect(-8, 3, 16, 3);
  // 头盔 + 红缨
  ctx.fillStyle = '#f1c9a0'; ctx.beginPath(); ctx.arc(1, -14, 7.5, 0, 7); ctx.fill();
  const hg = ctx.createLinearGradient(0, -24, 0, -12); hg.addColorStop(0, '#f1f4f8'); hg.addColorStop(1, '#98a4b6');
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(1, -15.5, 8.2, Math.PI * .98, Math.PI * 2.02); ctx.closePath(); ctx.fill();
  ctx.fillRect(-7.2, -16.5, 3, 6);
  ctx.fillStyle = '#e0392b'; ctx.beginPath(); ctx.moveTo(0, -23); ctx.quadraticCurveTo(-9 - wv * .5, -31, -11 - wv * .5, -21); ctx.quadraticCurveTo(-5, -25, 1, -22); ctx.fill();
  ctx.fillStyle = '#2b1d10'; ctx.beginPath(); ctx.arc(4.5, -13.5, 1.3, 0, 7); ctx.fill();
  // 剑
  ctx.save(); ctx.translate(9, -1); ctx.rotate(-1.15 + h.swing * 2.3);
  ctx.fillStyle = '#f2f5f9'; ctx.beginPath(); ctx.moveTo(1, -2.2); ctx.lineTo(20, -1.6); ctx.lineTo(24, 0); ctx.lineTo(20, 1.6); ctx.lineTo(1, 2.2); ctx.fill();
  ctx.fillStyle = '#d6a12c'; ctx.fillRect(-1, -5, 3, 10); ctx.fillStyle = '#6b4424'; ctx.fillRect(-7, -1.8, 6, 3.6);
  ctx.restore();
  if (h.swing > .25) { ctx.strokeStyle = `rgba(255,255,255,${h.swing * .85})`; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(7, -2, 29, -1.25, 1.05); ctx.stroke(); }
  ctx.restore();
}
function drawCastle() {
  const { x, y } = CASTLE, f = G.castleFlash;
  ctx.save(); ctx.translate(x + (f > 0 ? rand(-3, 3) * f : 0), y);
  shadow(10, 44, 150, 20, .32);
  const stone = (a, b) => { const g = ctx.createLinearGradient(0, -60, 0, 44); g.addColorStop(0, a); g.addColorStop(1, b); return g; };
  const hot = f > 0 ? `rgba(255,90,60,${f * .45})` : null;
  // 城墙
  ctx.fillStyle = stone('#d9cbb4', '#a8957a'); ctx.fillRect(-118, -12, 236, 54);
  for (let i = -118; i < 118; i += 24) { ctx.fillStyle = '#d9cbb4'; ctx.fillRect(i + 2, -26, 15, 15); ctx.fillStyle = '#b9a78c'; ctx.fillRect(i + 2, -15, 15, 4); }
  ctx.strokeStyle = 'rgba(100,80,55,.35)'; ctx.lineWidth = 1;
  for (let r = 0; r < 4; r++) { ctx.beginPath(); ctx.moveTo(-118, -2 + r * 12); ctx.lineTo(118, -2 + r * 12); ctx.stroke(); for (let c = -118 + (r % 2) * 14; c < 118; c += 28) { ctx.beginPath(); ctx.moveTo(c, -2 + r * 12); ctx.lineTo(c, 10 + r * 12); ctx.stroke(); } }
  // 塔楼
  for (const s of [-1, 1]) {
    ctx.fillStyle = stone('#e6dac5', '#9d8b70'); ctx.fillRect(s * 118 - 25, -48, 50, 90);
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(s * 118 + 8, -48, 17, 90);
    ctx.fillStyle = '#3a2a1c'; rr(s * 118 - 5, -22, 10, 18, 5); ctx.fill();
    const rg = ctx.createLinearGradient(s * 118 - 32, 0, s * 118 + 32, 0); rg.addColorStop(0, '#d9604e'); rg.addColorStop(1, '#8f2d22');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(s * 118 - 33, -46); ctx.lineTo(s * 118, -90); ctx.lineTo(s * 118 + 33, -46); ctx.closePath(); ctx.fill();
  }
  // 城门
  ctx.fillStyle = '#4a2e17'; ctx.beginPath(); ctx.moveTo(-28, 42); ctx.lineTo(-28, 6); ctx.arc(0, 6, 28, Math.PI, 0); ctx.lineTo(28, 42); ctx.fill();
  const dg = ctx.createLinearGradient(-24, 0, 24, 0); dg.addColorStop(0, '#8a5a30'); dg.addColorStop(.5, '#a8743f'); dg.addColorStop(1, '#7a4c26');
  ctx.fillStyle = dg; ctx.beginPath(); ctx.moveTo(-23, 42); ctx.lineTo(-23, 7); ctx.arc(0, 7, 23, Math.PI, 0); ctx.lineTo(23, 42); ctx.fill();
  ctx.strokeStyle = '#4a2e17'; ctx.lineWidth = 2; for (let i = -15; i <= 15; i += 7.5) { ctx.beginPath(); ctx.moveTo(i, -8); ctx.lineTo(i, 42); ctx.stroke(); }
  ctx.fillStyle = '#3b4250'; ctx.fillRect(-23, 14, 46, 4); ctx.fillRect(-23, 30, 46, 4);
  // 旗
  ctx.strokeStyle = '#5a4030'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(118, -90); ctx.lineTo(118, -122); ctx.stroke();
  const w = Math.sin(G.time * 5) * 3; ctx.fillStyle = '#2aa598'; ctx.beginPath(); ctx.moveTo(118, -122); ctx.quadraticCurveTo(132, -124 + w, 146, -114 + w); ctx.quadraticCurveTo(132, -110 + w, 118, -104); ctx.fill();
  if (hot) { ctx.fillStyle = hot; ctx.fillRect(-145, -92, 290, 136); }
  ctx.restore();
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#7c4a31'; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
  ctx.drawImage(BG, 0, 0, WW, WH);
  if (!G) return;
  for (const p of G.pads) drawPad(p);
  if (G.built === 0) {   // 新手提示
    const p = G.pads.reduce((a, b) => a.need < b.need ? a : b), yb = Math.sin(G.time * 6) * 6;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(p.x, p.y - 40 + yb); ctx.lineTo(p.x - 15, p.y - 62 + yb); ctx.lineTo(p.x - 6, p.y - 62 + yb); ctx.lineTo(p.x - 6, p.y - 82 + yb); ctx.lineTo(p.x + 6, p.y - 82 + yb); ctx.lineTo(p.x + 6, p.y - 62 + yb); ctx.lineTo(p.x + 15, p.y - 62 + yb); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.font = '900 23px sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(43,29,16,.85)';
    const tx = Math.max(100, Math.min(WW - 100, p.x)); ctx.strokeText('站到框里建塔', tx, p.y - 96 + yb); ctx.fillText('站到框里建塔', tx, p.y - 96 + yb);
  }
  for (const c of G.coinsOnGround) { shadow(c.x + 2, c.y + 6, 7, 3, .25); coinShape(c.x, c.y - Math.abs(Math.sin(G.time * 4 + c.ph)) * 2, 7.5, G.time * 5 + c.ph); }
  const objs = [...G.pads.filter(p => p.level).map(p => ({ y: p.y, f: () => drawTower(p) })),
    ...G.enemies.map(e => ({ y: e.y, f: () => drawEnemy(e) })), { y: G.hero.y, f: drawHero }];
  objs.sort((a, b) => a.y - b.y).forEach(o => o.f());
  drawCastle();
  for (const s of G.shots) {
    if (s.type === 'arrow') { ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.ang || 0);
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(-10, 0); ctx.stroke();
      ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 2.8; ctx.beginPath(); ctx.moveTo(-11, 0); ctx.lineTo(7, 0); ctx.stroke();
      ctx.fillStyle = '#e3e7ee'; ctx.beginPath(); ctx.moveTo(11, 0); ctx.lineTo(5, -3.5); ctx.lineTo(5, 3.5); ctx.fill(); ctx.restore(); }
    else { shadow(s.x + 3, s.y + 14, 6, 3, .3); ctx.fillStyle = '#23262e'; ctx.beginPath(); ctx.arc(s.x, s.y, 6.5, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(s.x - 2, s.y - 2, 2.2, 0, 7); ctx.fill(); }
  }
  for (const f of G.flyCoins) { const t = f.t; coinShape(f.x + (f.tx - f.x) * t, f.y + (f.ty - f.y) * t - Math.sin(t * Math.PI) * 34, 6.5, t * 9); }
  for (const q of G.parts) {
    if (q.ring) { const t = 1 - q.life / .3; ctx.strokeStyle = `rgba(255,220,150,${1 - t})`; ctx.lineWidth = 5 * (1 - t) + 1; ctx.beginPath(); ctx.ellipse(q.x, q.y, q.ring * (.4 + t * .6), q.ring * (.4 + t * .6) * .7, 0, 0, 7); ctx.stroke(); continue; }
    ctx.globalAlpha = Math.min(1, q.life * 2.2); ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.dust ? q.r * (1.5 - q.life) : q.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const f of G.floaters) {
    ctx.globalAlpha = Math.min(1, (1.4 - f.t) * 2); ctx.font = '900 24px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(43,29,16,.85)'; ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.c; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  if (input.active && running && !paused) {   // 摇杆
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(input.sx, input.sy, 55, 0, 7); ctx.fill(); ctx.stroke();
    let dx = input.x - input.sx, dy = input.y - input.sy; const l = Math.hypot(dx, dy); if (l > 55) { dx = dx / l * 55; dy = dy / l * 55; }
    ctx.fillStyle = 'rgba(255,255,255,.78)'; ctx.beginPath(); ctx.arc(input.sx + dx, input.sy + dy, 24, 0, 7); ctx.fill();
  }
}

// ================= 结束 / 菜单 =================
function best(mode) { try { return +localStorage.getItem('ch_best_' + mode) || 0; } catch (e) { return 0; } }
function setBest(mode, v) { try { if (v > best(mode)) localStorage.setItem('ch_best_' + mode, v); } catch (e) {} }
function endGame(win) {
  running = false; input.active = false; $('waveBtn').style.display = 'none';
  setBest(G.mode, win ? 20 : Math.max(0, G.wave - 1));
  $('endTitle').textContent = win ? '🏆 守住了！' : '城堡被攻破了';
  $('endText').innerHTML = win ? `20 波全部挡住！<br>你是真正的守城英雄。` : `坚持到了第 ${G.wave} 波。<br>多建几座塔、记得升级，再试一次！`;
  if (win) sBuild();
  setTimeout(() => $('endOv').classList.add('show'), win ? 300 : 700);
}
function showMenu() {
  running = false; G = null;
  ['endOv', 'pauseOv'].forEach(id => $(id).classList.remove('show'));
  $('waveBtn').style.display = 'none';
  const e = best('easy'), h = best('hard');
  $('rec').textContent = (e || h) ? `最好成绩：轻松 ${e} 波 · 挑战 ${h} 波` : '';
  $('menu').classList.add('show');
}
$('easyBtn').onclick = () => newGame('easy');
$('hardBtn').onclick = () => newGame('hard');
$('againBtn').onclick = () => newGame(G ? G.mode : 'easy');
$('menuBtn').onclick = showMenu;
$('quitBtn').onclick = showMenu;
$('waveBtn').onclick = startWave;
const soundLabel = () => $('soundBtn').textContent = soundOn ? '🔊 声音：开' : '🔈 声音：关';
soundLabel();
$('soundBtn').onclick = () => { soundOn = !soundOn; try { localStorage.setItem('ch_sound', soundOn ? '1' : '0'); } catch (e) {} soundLabel(); };
$('pauseBtn').onclick = () => { if (!running) return; paused = true; input.active = false; $('pauseOv').classList.add('show'); };
$('resumeBtn').onclick = () => { paused = false; $('pauseOv').classList.remove('show'); };
document.addEventListener('visibilitychange', () => { if (document.hidden && running) { paused = true; $('pauseOv').classList.add('show'); } });

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G && running && !paused) update(dt);
  draw();
  requestAnimationFrame(loop);
}
showMenu();
requestAnimationFrame(loop);
})();
</script>
