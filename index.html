<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14162b">
<title>Michael's Games</title>
<style>
  :root{--bg:#14162b;--card:#1f2242;--text:#f3f4ff;--muted:#9aa0d0;--accent:#ffcc4d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif}
  main{max-width:560px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
  h1{font-size:30px;margin:0 0 4px;font-weight:800}
  .sub{color:var(--muted);margin:0 0 24px}
  a.game{display:flex;gap:16px;align-items:center;text-decoration:none;color:inherit;background:var(--card);
    border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);
    transition:transform .15s ease, box-shadow .15s ease}
  a.game:active{transform:scale(.97)}
  @media (hover:hover){a.game:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.35)}}
  .thumb{flex:none;width:96px;height:96px;border-radius:16px;overflow:hidden}
  .thumb svg{display:block;width:100%;height:100%}
  .info{flex:1;min-width:0}
  .info h2{margin:0 0 4px;font-size:20px}
  .info p{margin:0 0 8px;color:var(--muted);font-size:14px;line-height:1.4}
  .play{display:inline-block;background:var(--accent);color:#222;font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px}
  .tip{margin-top:22px;color:var(--muted);font-size:13px;line-height:1.6;text-align:center}
</style>
</head>
<body>
<main>
  <h1>🎮 小游戏</h1>
  <p class="sub">免费 · 手机直接玩 · Free games for your phone</p>

  <a class="game" href="block-puzzle/">
    <div class="thumb">
      <svg viewBox="0 0 96 96" aria-hidden="true">
        <rect width="96" height="96" fill="#262b52"/>
        <g transform="translate(8 8)">
          <rect x="0"  y="0"  width="18" height="18" rx="4" fill="#20244a"/><rect x="20" y="0"  width="18" height="18" rx="4" fill="#ff5d73"/><rect x="40" y="0"  width="18" height="18" rx="4" fill="#ff5d73"/><rect x="60" y="0"  width="18" height="18" rx="4" fill="#20244a"/>
          <rect x="0"  y="20" width="18" height="18" rx="4" fill="#3ecbff"/><rect x="20" y="20" width="18" height="18" rx="4" fill="#20244a"/><rect x="40" y="20" width="18" height="18" rx="4" fill="#ffe14d"/><rect x="60" y="20" width="18" height="18" rx="4" fill="#ffe14d"/>
          <rect x="0"  y="40" width="18" height="18" rx="4" fill="#3ecbff"/><rect x="20" y="40" width="18" height="18" rx="4" fill="#4ddb7a"/><rect x="40" y="40" width="18" height="18" rx="4" fill="#20244a"/><rect x="60" y="40" width="18" height="18" rx="4" fill="#ffe14d"/>
          <rect x="0"  y="60" width="18" height="18" rx="4" fill="#b36bff"/><rect x="20" y="60" width="18" height="18" rx="4" fill="#b36bff"/><rect x="40" y="60" width="18" height="18" rx="4" fill="#b36bff"/><rect x="60" y="60" width="18" height="18" rx="4" fill="#20244a"/>
        </g>
      </svg>
    </div>
    <div class="info">
      <h2>Block Puzzle 方块拼图</h2>
      <p>把方块拖进 8×8 棋盘，填满整行或整列就消除。</p>
      <span class="play">▶ 开始玩</span>
    </div>
  </a>

  <a class="game" href="arrow-puzzle/">
    <div class="thumb">
      <svg viewBox="0 0 96 96" aria-hidden="true">
        <rect width="96" height="96" fill="#eceffa"/>
        <g fill="none" stroke="#15161c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 78 V22"/><path d="M34 60 V38 H58"/><path d="M78 20 H50 V30"/><path d="M78 78 H60 V56 H80"/><path d="M40 80 H22"/>
        </g>
        <g fill="#15161c">
          <path d="M18 14 l-6 9 h12z"/><path d="M66 38 l-9 -6 v12z"/><path d="M50 38 l-6 -9 h12z"/><path d="M88 56 l-9 -6 v12z"/><path d="M14 80 l9 -6 v12z"/>
        </g>
      </svg>
    </div>
    <div class="info">
      <h2>Arrow Out 箭头逃脱</h2>
      <p>点箭头让它滑出去，别撞到别的箭头。越往后越难！</p>
      <span class="play">▶ 开始玩</span>
    </div>
  </a>

  <a class="game" href="memory-game/">
    <div class="thumb">
      <svg viewBox="0 0 96 96" aria-hidden="true">
        <rect width="96" height="96" fill="#fff8ec"/>
        <rect x="8" y="8" width="36" height="36" rx="8" fill="#e8894a"/><text x="26" y="35" font-size="26" font-weight="800" fill="#fff" text-anchor="middle" font-family="sans-serif">?</text>
        <rect x="52" y="8" width="36" height="36" rx="8" fill="#e6f6ec" stroke="#2e8b57" stroke-width="3"/><text x="70" y="35" font-size="22" text-anchor="middle">🌸</text>
        <rect x="8" y="52" width="36" height="36" rx="8" fill="#e6f6ec" stroke="#2e8b57" stroke-width="3"/><text x="26" y="79" font-size="22" text-anchor="middle">🌸</text>
        <rect x="52" y="52" width="36" height="36" rx="8" fill="#e8894a"/><text x="70" y="79" font-size="26" font-weight="800" fill="#fff" text-anchor="middle" font-family="sans-serif">?</text>
      </svg>
    </div>
    <div class="info">
      <h2>翻牌配对</h2>
      <p>找出两个一样的图案。字大、牌大，适合长辈，慢慢玩。</p>
      <span class="play">▶ 开始玩</span>
    </div>
  </a>

  <p class="tip">💡 iPhone：Safari 里点「分享」→「添加到主屏幕」，就像 App 一样打开。</p>
</main>
</body>
</html>
