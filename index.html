<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6ef">
  <meta name="description" content="Michael 的公开项目导航，浏览投资研究、练习英语或挑一款小游戏。">
  <title>公开项目导航 · Michael Yang</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f7f6ef;
      color: #1d3229;
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main { max-width: 850px; margin: auto; padding: clamp(28px, 7vw, 80px) 22px; }
    header { border-top: 3px solid #24543d; padding-top: 16px; }
    .owner, .number { font: 600 .84rem ui-monospace, monospace; color: #4b6656; }
    .owner { margin: 0; letter-spacing: .12em; }
    h1 { font-size: clamp(2.3rem, 7vw, 4.3rem); margin: .6em 0; line-height: 1.1; }
    nav { border-top: 1px solid #a5b1a4; }
    .project {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: clamp(12px, 3vw, 28px);
      align-items: baseline;
      padding: clamp(20px, 4vw, 30px) 8px;
      border-bottom: 1px solid #bdc7b9;
      color: inherit;
      text-decoration: none;
    }
    .project:hover, .project:focus-visible { background: #eaf0e4; }
    a:focus-visible { outline: 3px solid #226749; outline-offset: 2px; }
    h2 { font-size: clamp(1.3rem, 4vw, 1.8rem); margin: 0; }
    .description { margin: 6px 0 0; color: #485a50; line-height: 1.6; }
    .arrow { color: #276046; font-size: 1.4rem; }
    footer { margin-top: 24px; }
    footer a { color: #285b42; text-underline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="owner">MICHAEL YANG</p>
      <h1>公开项目导航</h1>
    </header>
    <nav aria-label="公开项目">
      <a class="project" href="/investment-research-os/">
        <span class="number" aria-hidden="true">01</span>
        <div><h2>投资研究</h2><p class="description">浏览资产回报、行业与公司财报研究，查看数据来源和研究方法。</p></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="project" href="/nce-learning-lab/">
        <span class="number" aria-hidden="true">02</span>
        <div><h2>英语学习实验室</h2><p class="description">听英语音频，逐句听写，练习常用表达。</p></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="project" href="/games/">
        <span class="number" aria-hidden="true">03</span>
        <div><h2>小游戏 · 7 款</h2><p class="description">从方块拼图、翻牌配对到守城小英雄，选一款直接玩。</p></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>
    <footer><a href="https://github.com/werneryang?tab=repositories">查看全部公开仓库 <span aria-hidden="true">↗</span></a></footer>
  </main>
</body>
</html>
