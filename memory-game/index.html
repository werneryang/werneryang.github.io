<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff8ec">
<title>翻牌配对</title>
<style>
  :root{
    --bg:#fff8ec; --ink:#3a2a1a; --back:#e8894a; --back-edge:#c96e32;
    --face:#ffffff; --face-edge:#e6d6c2; --ok:#2e8b57; --ok-bg:#e6f6ec;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif}
  body{display:flex;flex-direction:column;height:100dvh;
    padding:calc(12px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
  h1{margin:6px 0 0;text-align:center;font-size:clamp(24px,8.2vw,34px);white-space:nowrap;font-weight:800;line-height:1.3}
  #status{display:flex;justify-content:center;gap:28px;font-size:clamp(24px,7vw,30px);font-weight:800;margin-top:4px}
  #status .lv{color:#8a5a2b}
  #status .sc{color:#c46a1b}
  #status .sc.bump{animation:pop .4s ease}
  #msg{height:52px;display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:800;color:var(--ok);transition:opacity .3s}
  #msg.hide{opacity:0}

  #grid{flex:1;min-height:0;display:grid;gap:16px;width:100%;max-width:560px;margin:0 auto;
    --sz-back:60px;--sz-open:80px}

  .card{position:relative;border:0;padding:0;margin:0;border-radius:22px;cursor:pointer;
    font:inherit;touch-action:manipulation;
    background:var(--back);box-shadow:0 6px 0 var(--back-edge);
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease, background .2s ease, box-shadow .2s ease}
  .card .sym{font-size:var(--sz-back);line-height:1}
  .card.back .sym{color:#fff;font-weight:800}
  .card:active,.card.pressed{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 var(--back-edge)}

  .card.open{background:var(--face);box-shadow:0 6px 0 var(--face-edge);outline:6px solid #f4b400;outline-offset:-6px}
  .card.open .sym{font-size:var(--sz-open)}
  .card.matched{background:var(--ok-bg);box-shadow:0 6px 0 #b7dfc5;outline:6px solid var(--ok);outline-offset:-6px}
  .card.matched .sym{font-size:var(--sz-open)}
  .card.pop{animation:pop .35s ease}
  @keyframes pop{50%{transform:scale(1.06)}}

  #win{position:fixed;inset:0;background:var(--bg);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:24px;text-align:center}
  #win.show{display:flex}
  #win .big{font-size:44px;font-weight:800;line-height:1.4;color:var(--ok)}
  #win .emoji{font-size:80px;line-height:1}
  #win .pts{font-size:30px;font-weight:800;line-height:1.6;color:#8a5a2b}
  #win .btns{display:flex;flex-direction:column;gap:20px;align-items:center}
  #win button{font:inherit;font-size:34px;font-weight:800;color:#fff;background:var(--back);border:0;
    border-radius:24px;padding:22px 48px;min-width:260px;box-shadow:0 6px 0 var(--back-edge);
    cursor:pointer;touch-action:manipulation}
  #win button.second{background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--face-edge);outline:4px solid var(--face-edge);outline-offset:-4px}
  #win button.small{font-size:26px;padding:14px 30px;background:transparent;color:#8a5a2b;box-shadow:none;text-decoration:underline}
  #win button:active{transform:translateY(4px)}
</style>
</head>
<body>
  <h1>找出两个一样的图案</h1>
  <div id="status"><span class="lv" id="lv">第 1 关</span><span class="sc" id="sc">⭐ 0 分</span></div>
  <div id="msg" class="hide">对了！</div>
  <div id="grid"></div>

  <div id="win" role="dialog">
    <div class="emoji">🎉</div>
    <div class="big">全部找到了！<br>真棒！</div>
    <div class="pts" id="pts"></div>
    <div class="btns">
      <button id="nextBtn">下一关</button>
      <button id="againBtn" class="second">再玩这一关</button>
      <button id="firstBtn" class="small">回到第一关</button>
    </div>
  </div>

<script>
(() => {
  // 难度：每一关多一对牌，最多 6 对（12 张），不会更难
  const ALL_PICS = ['🍎', '🐼', '🌸', '🍊', '🐟', '🐱', '🍉', '🌞'];
  const LEVELS = [ {pairs:3, cols:2}, {pairs:4, cols:2}, {pairs:5, cols:2}, {pairs:6, cols:3} ];
  const PAIR_POINTS = 10, FINISH_BONUS = 20;
  let level = 0, score = 0, roundPts = 0, PICS = [];
  try { level = Math.min(LEVELS.length - 1, Math.max(0, +localStorage.getItem('mg_level') || 0));
        score = Math.max(0, +localStorage.getItem('mg_score') || 0); } catch (e) {}
  function save() { try { localStorage.setItem('mg_level', level); localStorage.setItem('mg_score', score); } catch (e) {} }
  const lvEl = document.getElementById('lv'), scEl = document.getElementById('sc');
  function renderStatus(bump) {
    lvEl.textContent = '第 ' + (level + 1) + ' 关';
    scEl.textContent = '⭐ ' + score + ' 分';
    if (bump) { scEl.classList.remove('bump'); void scEl.offsetWidth; scEl.classList.add('bump'); }
  }
  const grid = document.getElementById('grid');
  const msg = document.getElementById('msg');
  const win = document.getElementById('win');
  let first = null, busy = false, found = 0, msgTimer = null;

  // ---- 柔和的声音（音量很小，渐入渐出） ----
  let ac = null;
  function tone(freq, start, len) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime + start, o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + len + 0.05);
    } catch (e) {}
  }
  const soundMatch = () => { tone(523, 0, 0.35); tone(659, 0.15, 0.45); };
  const soundWin = () => { tone(523, 0, 0.4); tone(659, 0.2, 0.4); tone(784, 0.4, 0.7); };

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function showMsg(text) {
    clearTimeout(msgTimer);
    msg.textContent = text; msg.classList.remove('hide');
    msgTimer = setTimeout(() => msg.classList.add('hide'), 1800);
  }

  function setOpen(card, open) {
    card.classList.toggle('open', open);
    card.classList.toggle('back', !open);
    card.querySelector('.sym').textContent = open ? card.dataset.pic : '?';
    card.setAttribute('aria-label', open ? '已翻开' : '背面');
  }

  // 根据屏幕大小排列牌，横屏时自动换成横排
  function layout() {
    const L = LEVELS[level], n = L.pairs * 2;
    let cols = L.cols, rows = Math.ceil(n / cols);
    if (window.innerWidth > window.innerHeight) { [cols, rows] = [rows, cols]; }
    grid.style.gridTemplateColumns = `repeat(${cols},1fr)`;
    grid.style.gridTemplateRows = `repeat(${rows},1fr)`;
    const r = grid.getBoundingClientRect();
    const cw = (r.width - 16 * (cols - 1)) / cols, ch = (r.height - 16 * (rows - 1)) / rows;
    const m = Math.min(cw, ch);
    grid.style.setProperty('--sz-back', Math.round(m * 0.5) + 'px');
    grid.style.setProperty('--sz-open', Math.round(m * 0.68) + 'px');
  }
  window.addEventListener('resize', layout);

  function start() {
    grid.innerHTML = ''; first = null; busy = false; found = 0; roundPts = 0;
    win.classList.remove('show'); msg.classList.add('hide');
    PICS = shuffle(ALL_PICS.slice()).slice(0, LEVELS[level].pairs);
    renderStatus(false); layout();
    shuffle([...PICS, ...PICS]).forEach(pic => {
      const b = document.createElement('button');
      b.className = 'card back'; b.dataset.pic = pic;
      b.innerHTML = '<span class="sym">?</span>';
      b.setAttribute('aria-label', '背面');
      b.addEventListener('click', () => tap(b));
      grid.appendChild(b);
    });
  }

  function tap(card) {
    if (busy || card.classList.contains('open') || card.classList.contains('matched')) return;
    setOpen(card, true);
    card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
    if (!first) { first = card; return; }

    const second = card;
    if (first.dataset.pic === second.dataset.pic) {
      [first, second].forEach(c => { c.classList.remove('open'); c.classList.add('matched'); });
      first = null; found++;
      score += PAIR_POINTS; roundPts += PAIR_POINTS;
      if (found === PICS.length) {
        score += FINISH_BONUS; roundPts += FINISH_BONUS;
        save(); renderStatus(true); soundWin();
        setTimeout(showWin, 700);
      } else {
        save(); renderStatus(true); soundMatch(); showMsg('对了！+' + PAIR_POINTS + ' 分');
      }
    } else {
      busy = true;
      const a = first; first = null;
      setTimeout(() => { setOpen(a, false); setOpen(second, false); busy = false; }, 1400);
    }
  }

  const nextBtn = document.getElementById('nextBtn'), againBtn = document.getElementById('againBtn'), firstBtn = document.getElementById('firstBtn');
  function showWin() {
    const atTop = level === LEVELS.length - 1;
    document.getElementById('pts').innerHTML = '这一关得了 ' + roundPts + ' 分<br>一共 ⭐ ' + score + ' 分';
    nextBtn.style.display = atTop ? 'none' : '';
    againBtn.textContent = atTop ? '再玩一次' : '再玩这一关';
    againBtn.className = atTop ? '' : 'second';
    firstBtn.style.display = level > 0 ? '' : 'none';
    win.classList.add('show');
  }
  nextBtn.addEventListener('click', () => { level = Math.min(level + 1, LEVELS.length - 1); save(); start(); });
  againBtn.addEventListener('click', start);
  firstBtn.addEventListener('click', () => { level = 0; save(); start(); });
  start();
})();
</script>
</body>
</html>
