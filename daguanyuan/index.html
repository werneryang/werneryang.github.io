<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7efe0">
<title>红楼梦·大观园 拼图</title>
<style>
  :root{
    --bg:#f7efe0; --ink:#3b2616; --red:#a8322d; --red-edge:#7e211d;
    --gold:#f2b51c; --ok:#2e7d4f; --paper:#fffaf0; --edge:#d9c7a8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Songti SC","Noto Serif SC","Microsoft YaHei",serif}
  body{display:flex;flex-direction:column;align-items:center;height:100dvh;
    padding:calc(10px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
  h1{margin:4px 0 0;font-size:clamp(26px,8vw,34px);font-weight:800;color:var(--red);letter-spacing:2px;white-space:nowrap}
  #sub{font-size:clamp(22px,6.2vw,26px);font-weight:700;margin-top:2px;white-space:nowrap}
  #msg{height:44px;display:flex;align-items:center;font-size:clamp(24px,7vw,30px);font-weight:800;color:var(--ok);transition:opacity .3s}
  #msg.hide{opacity:0}

  #wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
  #board{position:relative;background:#5a3a22;border-radius:14px;box-shadow:0 6px 18px rgba(60,30,10,.25)}
  .tile{position:absolute;border-radius:6px;background-repeat:no-repeat;cursor:pointer;touch-action:manipulation;
    transition:transform .35s ease, box-shadow .15s ease;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
  .tile.sel{z-index:3;box-shadow:inset 0 0 0 6px var(--gold),0 8px 18px rgba(0,0,0,.45)}
  .tile.done{cursor:default}
  .tile.done::before{content:"✓";position:absolute;right:4px;bottom:4px;width:clamp(22px,6vw,30px);height:clamp(22px,6vw,30px);
    border-radius:50%;background:#2e9d58;color:#fff;font:800 clamp(15px,4.2vw,20px)/clamp(22px,6vw,30px) sans-serif;text-align:center;
    box-shadow:0 0 0 2px #fff}
  #board.solved .tile.done::before{display:none}
  #msg.tip{color:var(--ink)}
  .tile.flash::after{content:"";position:absolute;inset:0;border-radius:6px;box-shadow:inset 0 0 0 6px #3fbf6a;animation:fl 1s ease forwards}
  @keyframes fl{0%,60%{opacity:1}100%{opacity:0}}
  .tile .num{position:absolute;left:4px;top:2px;font:800 clamp(18px,5vw,24px)/1 sans-serif;color:#fff;
    text-shadow:0 0 3px #000,0 0 3px #000;display:none}
  body.nums .tile .num{display:block}
  #board.solved .tile{border-radius:0;box-shadow:none}

  .btns{display:flex;gap:12px;width:100%;max-width:560px;margin-top:12px}
  button{font:inherit;font-weight:800;border:0;border-radius:18px;cursor:pointer;touch-action:manipulation}
  .btns button{flex:1;font-size:clamp(22px,6.4vw,28px);padding:14px 6px;background:var(--paper);color:var(--ink);
    box-shadow:0 5px 0 var(--edge);outline:3px solid var(--edge);outline-offset:-3px}
  .btns button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}

  .ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;padding:20px;text-align:center;background:var(--bg)}
  .ov.show{display:flex}
  #peek img{width:min(92vw,70dvh);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .ovtxt{font-size:clamp(24px,7vw,30px);font-weight:800}
  #win .big{font-size:clamp(34px,11vw,46px);font-weight:800;color:var(--red);line-height:1.3}
  #win img{width:min(70vw,38dvh);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  #win .cap{font-size:clamp(22px,6.4vw,28px);font-weight:700}
  #win .credit{font-size:18px;color:#7a6650}
  .big-btn{font-size:clamp(26px,8vw,32px);padding:18px 40px;min-width:260px;color:#fff;background:var(--red);box-shadow:0 6px 0 var(--red-edge)}
  .big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--red-edge)}
  .link-btn{font-size:24px;padding:8px 20px;background:transparent;color:#7a4a22;text-decoration:underline}
</style>
</head>
<body>
  <h1>红楼梦 · 大观园</h1>
  <div id="sub"></div>
  <div id="msg" class="hide"></div>
  <div id="wrap"><div id="board"></div></div>
  <div class="btns">
    <button id="peekBtn">看原图</button>
    <button id="hintBtn">帮我放一块</button>
  </div>

  <div class="ov" id="peek">
    <img id="peekImg" alt="原图">
    <div class="ovtxt">点一下，回到拼图</div>
  </div>

  <div class="ov" id="win">
    <div class="big">拼好了！真棒！</div>
    <img id="winImg" alt="完成的画">
    <div class="cap" id="winCap"></div>
    <button class="big-btn" id="nextBtn">再拼一幅</button>
    <button class="link-btn" id="sizeBtn"></button>
    <div class="credit">画作：清 · 孙温 绘《红楼梦》图</div>
  </div>

<script>
(() => {
  const PICS = [
    { src: 'p1.jpg', name: '大观园全景' },
    { src: 'p2.jpg', name: '元妃省亲 · 蓼汀花溆' },
    { src: 'p3.jpg', name: '华堂盛宴' },
    { src: 'p4.jpg', name: '厅堂雅集' },
  ];
  PICS.forEach(p => { const i = new Image(); i.src = p.src; }); // 预先加载

  const board = document.getElementById('board'), msg = document.getElementById('msg');
  const sub = document.getElementById('sub');
  let N = 4, picIdx = 0, pos = [], tiles = [], sel = null, solved = false, msgTimer = null;
  try {
    N = +localStorage.getItem('dgy_n') === 3 ? 3 : 4;
    picIdx = (+localStorage.getItem('dgy_pic') || 0) % PICS.length;
  } catch (e) {}
  const save = () => { try { localStorage.setItem('dgy_n', N); localStorage.setItem('dgy_pic', picIdx); } catch (e) {} };

  // 柔和提示音
  let ac = null;
  function tone(f, st, len, vol = 0.1) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime + st, o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + len + 0.05);
    } catch (e) {}
  }
  const soundOk = () => { tone(587, 0, 0.35); tone(784, 0.12, 0.45); };
  const soundWin = () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.18, 0.6)); };

  function showMsg(t) {
    clearTimeout(msgTimer); msg.textContent = t; msg.className = '';
    msgTimer = setTimeout(() => msg.classList.add('hide'), 1600);
  }

  // pos[slot] = 这块格子里放的是第几块
  let S = 0, GAP = 3;
  function layout() {
    const wrap = document.getElementById('wrap').getBoundingClientRect();
    S = Math.floor(Math.min(wrap.width, wrap.height, 620));
    board.style.width = board.style.height = S + 'px';
    GAP = solved ? 0 : 3;
    const cell = (S - GAP * (N + 1)) / N;
    tiles.forEach(t => {
      t.style.width = t.style.height = cell + 'px';
      t.style.backgroundSize = (cell * N) + 'px ' + (cell * N) + 'px';
      const p = +t.dataset.piece;
      t.style.backgroundPosition = `${-(p % N) * cell}px ${-Math.floor(p / N) * cell}px`;
    });
    place();
  }
  function place() {
    const cell = (S - GAP * (N + 1)) / N;
    pos.forEach((piece, slot) => {
      const t = tiles[piece];
      const x = GAP + (slot % N) * (cell + GAP), y = GAP + Math.floor(slot / N) * (cell + GAP);
      t.style.transform = `translate(${x}px,${y}px)`;
    });
  }
  window.addEventListener('resize', layout);

  const isDone = slot => pos[slot] === slot;
  const correctCount = () => pos.filter((p, s) => p === s).length;
  function updateSub() { sub.textContent = `已放对 ${correctCount()} / ${N * N} 块`; }

  function start() {
    solved = false; sel = null;
    board.classList.remove('solved'); board.innerHTML = '';
    document.getElementById('win').classList.remove('show');
    const pic = PICS[picIdx];
    // 打乱：保证一开始没有任何一块在正确位置
    const n = N * N;
    do {
      pos = [...Array(n).keys()];
      for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pos[i], pos[j]] = [pos[j], pos[i]]; }
    } while (pos.some((p, s) => p === s));
    tiles = [];
    for (let p = 0; p < n; p++) {
      const t = document.createElement('div');
      t.className = 'tile'; t.dataset.piece = p;
      t.style.backgroundImage = `url(${pic.src})`;
      t.innerHTML = `<span class="num">${p + 1}</span>`;
      t.addEventListener('click', () => tap(p));
      board.appendChild(t); tiles.push(t);
    }
    document.getElementById('peekImg').src = pic.src;
    clearTimeout(msgTimer); msg.textContent = '点两块，它们就换位置'; msg.className = 'tip';
    updateSub(); layout();
  }

  function slotOf(piece) { return pos.indexOf(piece); }

  function swap(a, b) { // 交换两个格子
    [pos[a], pos[b]] = [pos[b], pos[a]];
    place();
    let good = 0;
    [a, b].forEach(s => {
      if (isDone(s)) {
        good++;
        const t = tiles[pos[s]];
        t.classList.add('done');
        t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash');
      }
    });
    updateSub();
    if (correctCount() === N * N) return win();
    if (good) { soundOk(); showMsg(good > 1 ? '放对了两块！' : '放对了！'); }
  }

  function tap(piece) {
    if (solved) return;
    const slot = slotOf(piece);
    if (isDone(slot)) { showMsg('这块已经放对了'); return; }
    if (sel === null) { sel = piece; tiles[piece].classList.add('sel'); return; }
    if (sel === piece) { tiles[piece].classList.remove('sel'); sel = null; return; }
    tiles[sel].classList.remove('sel');
    const a = slotOf(sel); sel = null;
    swap(a, slot);
  }

  function hint() {
    if (solved) return;
    if (sel !== null) { tiles[sel].classList.remove('sel'); sel = null; }
    const target = pos.findIndex((p, s) => p !== s);   // 第一个没放对的格子
    if (target < 0) return;
    swap(slotOf(target), target);                        // 把属于这里的那块放过来
  }

  function win() {
    solved = true; soundWin();
    setTimeout(() => { board.classList.add('solved'); layout(); }, 400);
    setTimeout(() => {
      const pic = PICS[picIdx];
      document.getElementById('winImg').src = pic.src;
      document.getElementById('winCap').textContent = '《' + pic.name + '》';
      document.getElementById('sizeBtn').textContent = N === 4 ? '换成 9 块（容易些）' : '换成 16 块（难一点）';
      document.getElementById('win').classList.add('show');
    }, 1900);
  }

  document.getElementById('peekBtn').onclick = () => document.getElementById('peek').classList.add('show');
  document.getElementById('peek').onclick = () => document.getElementById('peek').classList.remove('show');
  document.getElementById('hintBtn').onclick = hint;
  document.getElementById('nextBtn').onclick = () => { picIdx = (picIdx + 1) % PICS.length; save(); start(); };
  document.getElementById('sizeBtn').onclick = () => { N = N === 4 ? 3 : 4; save(); start(); };

  start();
})();
</script>
</body>
</html>
